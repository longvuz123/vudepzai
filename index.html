{t:"Đọc hiểu: Cultural diversity",p:"<p>[1] Cultural diversity refers to the presence of multiple cultural groups and their practices within a society. It encompasses various aspects such as language, traditions, beliefs, and values. Embracing cultural diversity can lead to a more inclusive and harmonious society, where individuals <b>appreciate</b> and respect differences. This diversity enriches communities by introducing new perspectives, fostering creativity, and promoting mutual understanding.</p><p>[2] One significant benefit of cultural diversity is the exchange of ideas and knowledge. When people from different cultural backgrounds interact, they share their unique experiences and insights. This exchange can lead to innovative solutions and improvements in various fields such as science, art, and business. Moreover, cultural diversity can <b>enhance</b> social cohesion by encouraging people to work together and learn from one another.</p><p>[3] Education plays a crucial role in promoting cultural diversity. <u>Schools and universities can create inclusive environments by incorporating diverse perspectives into their curricula</u> and encouraging students to engage with different cultures. By doing so, educational institutions help students develop a global mindset and prepare them for a multicultural world. Additionally, exposure to diverse cultures at a young age can reduce prejudices and promote tolerance.</p><p>[4] In the workplace, cultural diversity can boost productivity and creativity. Diverse teams bring together individuals with different skills, viewpoints, and problem-solving approaches. This variety can enhance decision-making processes and lead to more effective and innovative solutions. Companies that prioritize cultural diversity also tend to have a more positive work environment and higher employee satisfaction.</p><p>[5] Despite <b>its</b> benefits, cultural diversity also presents challenges. Misunderstandings and conflicts can arise when people from different cultural backgrounds interact. To address these challenges, it is essential to promote open communication and cultural competence. By fostering an inclusive culture, societies and organizations can maximize the benefits of cultural diversity while minimizing potential conflicts.</p>",q:[

{t:"Đọc hiểu: Green Living",p:"<p>[1] <b>[I]</b> Green living, often referred to as sustainable living, encourages individuals to adopt environmentally friendly practices in their daily lives. <b>[II]</b> This lifestyle includes reducing waste, conserving natural resources, and promoting eco-friendly habits, which collectively help to minimize the negative impact on the environment. <b>[III]</b> Although green living requires effort and adjustment, its benefits for the planet and future generations are substantial. <b>[IV]</b></p><p>[2] One of the fundamental aspects of green living is waste reduction. This can be achieved through practices like recycling, composting, and reducing single-use plastics. Recycling and composting can significantly decrease the amount of waste sent to landfills, which helps reduce greenhouse gas emissions and pollution. Additionally, adopting reusable items such as water bottles and shopping bags minimizes reliance on plastic, which is crucial for protecting ecosystems and wildlife.</p><p>[3] Another key component of green living is energy conservation. Simple changes, like switching to LED light bulbs and using public transportation, can reduce an individual's <b>carbon footprint</b>. Energy efficiency improvements, if widely implemented, could decrease global energy demand by up to 40% by 2050. By conserving energy, individuals not only lower <b>their</b> utility bills but also contribute to the reduction of carbon emissions, which is essential for <b>mitigating</b> climate change.</p><p>[4] Green living also involves making conscious choices about the products we consume. This includes opting for sustainably sourced goods, supporting local businesses, and choosing organic produce. Sustainable agriculture practices reduce the need for chemical pesticides and fertilizers, which can harm both the soil and water sources. <u>By making informed purchases, consumers can support eco-friendly industries and help create a demand for greener alternatives.</u></p>",q:[

{t:"Đề 2 – Điền cụm vào đoạn văn về Đại tướng Võ Nguyên Giáp",p:"<p><b>GENERAL VÕ NGUYÊN GIÁP: A LIFE OF DEDICATION</b></p><p>General Võ Nguyên Giáp is remembered as one of Vietnam’s most respected military leaders. Born in Quảng Bình Province in 1911, he worked as a history teacher before devoting himself to the struggle for national independence. His dedication and strategic thinking (18) ____.</p><p>During the First Indochina War, General Giáp played a key role in planning military operations against the French army. (19) ____, he decided to change his original plan for the Dien Bien Phu campaign, choosing a more cautious strategy to protect his soldiers. This decision contributed to the historic victory in 1954.</p><p>His military strategies, (20) ____, demonstrated his ability to combine careful planning with a deep understanding of the battlefield. His leadership inspired generations of Vietnamese people to remain determined in the face of difficulties.</p><p>General Giáp’s influence extended beyond the battlefield. Many young people (21) ____ because of his courage, dedication, and contributions to national independence. Learning about his life helps students understand the importance of responsibility and perseverance.</p><p>His story reminds us that true greatness involves not only achieving success but also serving others. (22) ____. His legacy continues to inspire generations of Vietnamese people.</p>",q:[

{t:"Đề 2 – Đọc hiểu: Urban Gardening",p:"<p>[1] In recent years, more people living in cities have started growing plants in their homes, on rooftops, or in small community spaces. This movement, known as urban gardening, is becoming popular as city dwellers look for ways to reconnect with nature despite <b>limited</b> space. According to environmental experts, urban gardening not only helps improve air quality but also reduces the negative effects of city heat.</p><p>[2] Beyond environmental benefits, urban gardening also promotes mental health. Studies suggest that spending time caring for plants can lower stress levels and increase happiness. Many urban gardeners say they feel more relaxed after watering or pruning their plants. Moreover, growing one’s own herbs or vegetables gives a sense of independence and responsibility.</p><p>[3] Urban gardening is also a way to strengthen community bonds. In many cities, residents share garden spaces where <b>they</b> plant, harvest, and exchange ideas about sustainable living. These shared gardens often become places where people from different backgrounds meet and support one another, turning empty lots into vibrant social hubs.</p><p>[4] However, maintaining urban gardens can be challenging. Limited sunlight, water access, and pollution are major <b>obstacles</b>. Fortunately, innovative solutions are being developed. For instance, <u>hydroponic systems—where plants grow in nutrient-rich water instead of soil—allow people to garden indoors efficiently</u>. With such technologies, urban gardening may become a key part of creating greener, healthier cities in the future.</p>",q:[

{t:"Đề 2 – Đọc hiểu: Renewable energy",p:"<p>[1] Even though natural energy sources are considered the future solution, we have harnessed them for a long time. For example, windmills were used to grind grain. However, human beings are increasingly becoming <b>reliant</b> on using fossil fuels such as coal and oil, which has caused a lot of environmental problems. As a result, scientists are attempting to preserve the environment by using renewable sources such as solar, wind and many other types.</p><p>[2] For billions of years, the sun has produced energy. The amount of sunlight striking the earth's surface in an hour can <b>meet the planet's power needs</b> in a full year. Sunlight is <b>harnessed</b> to generate two forms of energy: electricity and heat by using solar panels or solar absorbers, which can be installed on residents' rooftops or open areas.</p><p>[3] <b>[I]</b> Wind power can also be used to generate electricity through wind turbines. The size of a wind turbine depends on the energy demand. <b>[II]</b> For example, the amount of electricity that is required inside a high-rise building can be provided by small turbines with a capacity of under 50 kilowatts. On the other hand, large corporations that produce energy for sale need to install huge wind turbines at the power plant scale, with a capacity from 1.5 to 7.5 megawatts.</p><p>[4] <b>[III]</b> As a natural power to generate electricity, hydroelectric power utilises a dam or diversion structure in the process of harnessing the energy of a flowing river or other body of water. <b>[IV]</b> However, dam construction can negatively affect the ecology of a river and nearby agricultural activities. In fact, it might have a huge impact on the local environment. Therefore, <u>it is vital to research various regions thoroughly to minimise the potential negative effects</u>.</p>",q:[
["Where in this passage does the following sentence best fit? “Another type of renewable energy is hydroelectric power.”",["[I]","[II]","[III]","[IV]"],2,1],

["Which best paraphrases the underlined sentence in paragraph 4?",["Comprehensive research on regional effects is not necessary to avoid environmental damage.","Studying many different areas is necessary to prevent positive impacts on the environment.","Understanding the environmental effects of dam construction requires little effort.","It is essential to carefully study different areas to reduce the possible harmful impacts."],3],

const H={"mcq": [{"n": 1, "stem": "Chất nào sau đây thuộc loại ester?", "o": ["CH<sub>3<\/sub>COOC<sub>2<\/sub>H<sub>5<\/sub>.", "СН3СООН.", "H<sub>2<\/sub>N-CH<sub>2<\/sub>-COOH.", "CH3СНО."], "a": 0}, {"n": 2, "stem": "Palmitic acid là một acid béo có trong mỡ động vật và dầu cọ. Công thức của palmitic acid là", "o": ["C<sub>3<\/sub>H<sub>5<\/sub>(OH)<sub>3<\/sub>.", "CH<sub>3<\/sub>COOH.", "C<sub>15<\/sub>H<sub>31<\/sub>COOH.", "C<sub>17<\/sub>H<sub>35<\/sub>COOH."], "a": 2}, {"n": 3, "stem": "Chất nào sau đây là chất béo?", "o": ["Cellulose.", "Stearic acid.", "Glycerol.", "Tristearin."], "a": 3}, {"n": 4, "stem": "Ester no, đơn chức, mạch hở có công thức tổng quát là", "o": ["CnH<sub>2n<\/sub>O<sub>2<\/sub> (n ≥ 2).", "CnH<sub>2n-2<\/sub>O<sub>2<\/sub> (n ≥ 2).", "CnH<sub>2n+2<\/sub>O<sub>2<\/sub> (n ≥ 2).", "CnH<sub>2n<\/sub>O (n ≥ 2)."], "a": 0}, {"n": 5, "stem": "Phát biểu nào sau đây đúng?", "o": ["Chất béo là triester của glycerol với acid.", "Chất béo là triester của glycerol với acid vô cơ.", "Chất béo là triester của glycerol với acid béo", "Chất béo là triester của alcohol với acid béo."], "a": 2}, {"n": 6, "stem": "Ester đơn chức có công thức chung là", "o": ["RCOOR'.", "RCOOH.", "(RCOO)<sub>2<\/sub>R'.", "RCOR'."], "a": 0}, {"n": 7, "stem": "Chất nào sau đây là chất béo?", "o": ["Oleic acid.", "Stearic acid.", "Glycerol.", "Tristearin."], "a": 3}, {"n": 8, "stem": "Số nguyên tử carbon trong phân tử stearic acid là", "o": ["18.", "15.", "19.", "16."], "a": 0}, {"n": 9, "stem": "Ester X có công thức phân tử C<sub>4<\/sub>H<sub>8<\/sub>O<sub>2<\/sub>. Thủy phân X trong dung dịch NaOH dư, thu được sản phẩm gồm sodium propionate và alcohol Y. Công thức của Y là", "o": ["C<sub>3<\/sub>H<sub>5<\/sub>(OH)<sub>3<\/sub>.", "C<sub>2<\/sub>H<sub>5<\/sub>OH.", "C<sub>3<\/sub>H<sub>7<\/sub>OH.", "CH<sub>3<\/sub>OH."], "a": 3}, {"n": 10, "stem": "Số nguyên tử carbon trong phân tử palmitic acid là", "o": ["17.", "18.", "19", "16."], "a": 3}, {"n": 11, "stem": "Số nguyên tử hydrogen trong phân tử methyl formate  là", "o": ["6.", "8.", "4.", "2."], "a": 2}, {"n": 12, "stem": "Trong phòng thí nghiệm, ester thường được điều chế trực tiếp bằng phản ứng ester hóa giữa cặp chất nào sau đây dưới tác dụng của xúc tác H<sub>2<\/sub>SO<sub>4<\/sub> đặc và đun nóng?", "o": ["Carboxylic acid và alcohol.", "Aldehyde và alcohol.", "Hydrocarbon và carboxylic acid.", "Ester và dung dịch kiềm."], "a": 0}, {"n": 13, "stem": "Trong thí nghiệm điều chế ethyl acetate từ acetic acid (CH<sub>3<\/sub>COOH) và ethanol (C<sub>2<\/sub>H<sub>5<\/sub>OH), vai trò của dung dịch H<sub>2<\/sub>SO<sub>4<\/sub> đặc là gì?", "o": ["Vừa làm chất xúc tác, vừa hút nước làm chuyển dịch cân bằng theo chiều thuận giúp tăng hiệu suất tạo ester.", "Chỉ đóng vai trò làm chất chỉ thị màu nhận biết sản phẩm.", "Hòa tan hoàn toàn sản phẩm ester vào môi trường nước.", "Làm giảm nhiệt độ sôi của các chất tham gia phản ứng."], "a": 0}, {"n": 14, "stem": "Sau khi đun cách thủy hỗn hợp điều chế ethyl acetate, bước tiếp theo người ta rót thêm dung dịch NaCl bão hòa vào ống nghiệm nhằm mục đích chính là", "o": ["Giảm độ tan của ethyl acetate, giúp hỗn hợp tách lớp nhanh và rõ rệt hơn.", "Xúc tác cho phản ứng giữa acid và alcohol diễn ra hoàn toàn.", "Hòa tan ethyl acetate vào lớp nước phía dưới.", "Trung hòa hoàn toàn lượng acid dư sau phản ứng."], "a": 0}, {"n": 15, "stem": "Ester được tạo thành từ phản ứng ester hóa giữa CH<sub>3<\/sub>COOH và C<sub>2<\/sub>H<sub>5<\/sub>OH có công thức nào sau đây?", "o": ["СН3СООСН3.", "CH<sub>3<\/sub>COOC<sub>2<\/sub>H<sub>5<\/sub>.", "С2Н5СООСН3.", "CH<sub>3<\/sub>OC<sub>2<\/sub>H<sub>5<\/sub>."], "a": 1}, {"n": 16, "stem": "Ester X được tạo bởi ethyl alcohol và acetic acid. Công thức của X là", "o": ["CH<sub>3<\/sub>COOCH<sub>3<\/sub>.", "HCOOC<sub>2<\/sub>H<sub>5<\/sub>.", "HCOOCH<sub>3<\/sub>.", "CH<sub>3<\/sub>COOC<sub>2<\/sub>H<sub>5<\/sub>."], "a": 3}, {"n": 17, "stem": "Cho các ester có công thức như sau: C<sub>2<\/sub>H<sub>5<\/sub>COOCH<sub>3<\/sub> (1); CH<sub>3<\/sub>CH<sub>2<\/sub>CH<sub>2<\/sub>COOC<sub>2<\/sub>H<sub>5<\/sub> (2); CH<sub>3<\/sub>COOCH<sub>3<\/sub> (3); C<sub>2<\/sub>H<sub>5<\/sub>COOC<sub>2<\/sub>H<sub>5<\/sub> (4). Thứ tự tăng dần độ tan trong nước là", "o": ["(1); (2); (3); (4).", "(3); (1); (2); (4).", "(2); (4); (1); (3).", "(2); (1); (3); (4)."], "a": 2}, {"n": 18, "stem": "Chất nào sau đây có trạng thái lỏng ở điều kiện thường?", "o": ["(C<sub>17<\/sub>H<sub>33<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>.", "(C<sub>17<\/sub>H<sub>35<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>.", "C<sub>6<\/sub>H<sub>5<\/sub>OH (phenol).", "(C<sub>15<\/sub>H<sub>31<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>."], "a": 0}, {"n": 19, "stem": "So sánh nhiệt độ sôi giữa các chất có phân tử khối tương đương: CH<sub>3<\/sub> COOCH<sub>3<\/sub> (ester), C<sub>3<\/sub>H<sub>7<\/sub>OH (alcohol) và C<sub>2<\/sub>H<sub>5<\/sub>COOH (carboxylic acid). Phát biểu nào sau đây giải thích ĐÚNG về nhiệt độ sôi của ester?", "o": ["Ester có nhiệt độ sôi cao nhất vì liên kết ester rất bền vững nhiệt.", "Ester có nhiệt độ sôi bằng với alcohol vì đều chứa nguyên tử oxygen trong phân tử.", "Ester có nhiệt độ sôi thấp hơn rõ rệt so với alcohol và carboxylic acid tương ứng vì giữa các phân tử ester không tạo được liên kết hydrogen liên phân tử.", "Ester có nhiệt độ sôi cao hơn alcohol nhưng thấp hơn carboxylic acid."], "a": 2}, {"n": 20, "stem": "Ở nhiệt độ phòng (25 °C), tristearin ((C<sub>17<\/sub> H<sub>35<\/sub>COO)<sub>3<\/sub> C<sub>3<\/sub> H<sub>5<\/sub>) và triolein ((C<sub>17<\/sub> H<sub>33<\/sub>COO)<sub>3<\/sub> C<sub>3<\/sub> H<sub>5<\/sub>) tồn tại ở trạng thái vật lí lần lượt là", "o": ["chất lỏng và chất rắn.", "chất lỏng và chất lỏng.", "chất rắn và chất lỏng.", "chất rắn và chất rắn."], "a": 2}, {"n": 21, "stem": "Phát biểu nào sau đây KHÔNG đúng khi nói về tính chất vật lí của ester và chất béo?", "o": ["Các ester đơn giản thường là chất lỏng, nhẹ hơn nước và rất ít tan trong nước.", "Nhiều ester có mùi thơm dễ chịu của các loại hoa quả chín (như isoamyl acetate có mùi chuối chín, ethyl butyrate có mùi dứa).", "Chất béo không tan trong nước nhưng tan nhiều trong các dung môi hữu cơ không cực như benzene, hexane, ether.", "Tất cả các ester và chất béo đều tan tốt trong nước ở nhiệt độ thường tạo thành dung dịch đồng nhất."], "a": 3}, {"n": 22, "stem": "Ester CH<sub>3<\/sub>COOCH<sub>3<\/sub> có tên gọi là", "o": ["ethyl acetate.", "methyl propionate.", "methyl acetate.", "ethyl formate."], "a": 2}, {"n": 23, "stem": "Benzyl acetate là ester có mùi thơm của hoa nhài. Công thức cấu tạo của benzyl acetate là", "o": ["CH<sub>3<\/sub>COOC<sub>6<\/sub>H<sub>5<\/sub>.", "CH<sub>3<\/sub>COOCH<sub>2<\/sub>C<sub>6<\/sub>H<sub>5<\/sub>.", "C<sub>6<\/sub>H<sub>5<\/sub>COOCH<sub>3<\/sub>.", "C<sub>2<\/sub>H<sub>5<\/sub>COOCH<sub>3<\/sub>."], "a": 1}, {"n": 24, "stem": "Vinyl acetate có công thức cấu tạo thu gọn là", "o": ["CH<sub>3<\/sub>COOCH=CH<sub>2<\/sub>.", "CH<sub>2<\/sub>=CHCOOCH<sub>3<\/sub>.", "C<sub>2<\/sub>H<sub>5<\/sub>COOCH=CH<sub>2<\/sub>.", "HCOOCH=CH<sub>2<\/sub>."], "a": 0}, {"n": 25, "stem": "Ester nào sau đây có công thức cấu tạo thu gọn là HCOOCH<sub>3<\/sub>?", "o": ["Methyl formate.", "Ethyl formate.", "Methyl acetate.", "Ethyl acetate."], "a": 0}, {"n": 26, "stem": "Ester ethyl acetate có công thức cấu tạo thu gọn là", "o": ["HCOOC<sub>2<\/sub>H<sub>5<\/sub>.", "CH<sub>3<\/sub>COOC<sub>2<\/sub>H<sub>5<\/sub>.", "CH<sub>3<\/sub>COOCH<sub>3<\/sub>.", "C<sub>2<\/sub>H<sub>5<\/sub>COOCH<sub>3<\/sub>."], "a": 1}, {"n": 27, "stem": "Thủy phân hoàn toàn triglyceride X trong dung dịch NaOH thu được C<sub>17<\/sub>H<sub>35<\/sub>COONa và C<sub>3<\/sub>H<sub>5<\/sub>(OH)<sub>3<\/sub>. Công thức của X là", "o": ["(C<sub>15<\/sub>H<sub>31<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>.", "(C<sub>17<\/sub>H<sub>31<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>.", "(C<sub>17<\/sub>H<sub>35<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>.", "(C<sub>17<\/sub>H<sub>33<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>."], "a": 2}, {"n": 28, "stem": "Triolein tác dụng với H<sub>2<\/sub> dư (Ni, to) thu được chất X. Thủy phân triolein thu được alcohol Y. X và Y lần lượt là", "o": ["tripalmitin và ethylene glycol.", "tripalmitin và glycerol.", "tristearin và ethylene glycol.", "tristearin và glycerol."], "a": 3}, {"n": 29, "stem": "Hydrogen hóa hoàn toàn 17,68 gam triolein cần vừa đủ amol khí H<sub>2<\/sub>. Giá trị của a là", "o": ["0,03.", "0,02.", "0,06.", "0,04."], "a": 2}, {"n": 30, "stem": "Cho 8,8 gam ester X đơn chức phản ứng hoàn toàn với dung dịch NaOH, thu được 3,2 gam CH<sub>3<\/sub>OH. Tên của X là", "o": ["ethyl acetate.", "methyl acetate.", "propyl formate.", "methyl propionate."], "a": 3}, {"n": 31, "stem": "Thủy phân hoàn toàn hỗn hợp ethyl propionate và ethyl formate trong dung dịch NaOH, thu được sản phẩm gồm", "o": ["1 muối và 1 alcohol.", "2 muối và 2 alcohol.", "1 muối và 2 alcohol.", "2 muối và 1 alcohol."], "a": 3}, {"n": 32, "stem": "Triolein không tác dụng với chất (hoặc dung dịch) nào sau đây?", "o": ["H<sub>2<\/sub>O (xúc tác H<sub>2<\/sub>SO<sub>4<\/sub> loãng, đun nóng).", "Cu(OH)<sub>2<\/sub> (ở điều kiện thường).", "Dung dịch NaOH (đun nóng).", "H<sub>2<\/sub> (xúc tác Ni, đun nóng)."], "a": 1}, {"n": 33, "stem": "Từ dầu thực vật làm thế nào để sản xuất được bơ nhân tạo?", "o": ["Hydrogen hóa acid béo.", "Đề hydrogen hóa chất béo lỏng.", "Hydrogen hóa chất béo lỏng.", "Xà phòng hóa chất béo lỏng."], "a": 2}, {"n": 34, "stem": "Trong thí nghiệm xà phòng hóa chất béo (mỡ động vật hoặc dầu thực vật) bằng dung dịch NaOH đặc trong bát sứ, trong quá trình đun sôi nhẹ hỗn hợp, thỉnh thoảng người ta phải thêm vài giọt nước cất. Mục đích chính của việc thêm nước cất là", "o": ["để giữ cho thể tích hỗn hợp phản ứng không đổi và tránh hỗn hợp bị cạn khô, giúp phản ứng thủy phân xảy ra liên tục.", "để làm giảm nhiệt độ của phản ứng, tránh làm xà phòng sinh ra bị cháy đen.", "để làm tăng tốc độ phản ứng xà phòng hóa giữa chất béo và dung dịch NaOH.", "để hòa tan hoàn toàn lượng xà phòng tạo thành nổi trên mặt dung dịch."], "a": 0}, {"n": 35, "stem": "Sau khi đun sôi hỗn hợp mỡ lợn và dung dịch NaOH 40% trong bát sứ khoảng 10–15 phút, bước tiếp theo người ta rót thêm khoảng 30 mL dung dịch NaCl bão hòa vào hỗn hợp, khuấy nhẹ rồi để nguội. Tác dụng chính của dung dịch NaCl bão hòa là", "o": ["làm tăng khối lượng riêng của dung dịch và giảm độ tan của muối acid béo, giúp xà phòng tách ra và nổi lên phía trên.", "làm chất xúc tác giúp phản ứng xà phòng hóa diễn ra hoàn toàn hơn.", "trung hòa hoàn toàn lượng dung dịch NaOH còn dư sau phản ứng.", "hòa tan chất béo dư để dễ thu lấy sản phẩm glycerol ở lớp dưới."], "a": 0}, {"n": 36, "stem": "Tiến hành thí nghiệm xà phòng hóa tristearin ((C<sub>17<\/sub>H<sub>35<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>) bằng dung dịch NaOH đun nóng. Sau khi kết thúc phản ứng, thêm dung dịch NaCl bão hòa rồi để nguội. Hiện tượng quan sát được là", "o": ["xuất hiện lớp chất rắn màu trắng nổi lên phía trên, đó là sodium stearate (thành phần chính của xà phòng).", "chất lỏng trong bát sứ trở thành một dung dịch hoàn toàn đồng nhất và trong suốt.", "xuất hiện kết tủa màu đỏ gạch của Cu<sub>2<\/sub>O ở đáy bát sứ.", "hỗn hợp chất lỏng phân thành hai lớp, lớp phía trên là glycerol nguyên chất."], "a": 0}, {"n": 37, "stem": "Phát biểu nào sau đây là ĐÚNG khi nói về chất giặt rửa tổng hợp?", "o": ["Chất giặt rửa tổng hợp là muối sodium hoặc potassium của acid béo thu được từ phản ứng xà phòng hóa mỡ động vật.", "Chất giặt rửa tổng hợp là những hợp chất không phải muối sodium hay potassium của acid béo nhưng có tính chất giặt rửa tương tự xà phòng.", "Chất giặt rửa tổng hợp không chứa đầu ưa nước hay đuôi kị nước trong cấu tạo phân tử.", "Chất giặt rửa tổng hợp luôn bị mất hoàn toàn tác dụng giặt rửa khi dùng trong nước cứng."], "a": 1}, {"n": 38, "stem": "Phân tử xà phòng và chất giặt rửa tổng hợp đều có đặc điểm cấu tạo chung là gồm hai phần:", "o": ["đầu kị nước (gốc hydrocarbon mạch dài) và đuôi ưa nước (nhóm ionic hoặc phân cực).", "đầu ưa nước (nhóm ionic hoặc phân cực) và đuôi kị nước / ưa dầu mỡ (gốc hydrocarbon mạch dài).", "hai đầu đều là gốc hydrocarbon mạch ngắn phân nhánh.", "hai đầu đều là các nhóm chức carboxylic acid (-COOH)."], "a": 1}, {"n": 39, "stem": "Chất nào sau đây là thành phần chính của xà phòng truyền thống?", "o": ["C<sub>17<\/sub>H<sub>35<\/sub>COONa (sodium stearate).", "CH<sub>3<\/sub>COONa (sodium acetate).", "C<sub>12<\/sub>H<sub>25<\/sub>-C<sub>6<\/sub>H<sub>4<\/sub>-SO<sub>3<\/sub>Na (sodium alkylbenzenesulfonate).", "C<sub>2<\/sub>H<sub>5<\/sub>COONa (sodium propionate)."], "a": 0}, {"n": 40, "stem": "Phân tử xà phòng và chất giặt rửa tổng hợp đều có đặc điểm cấu tạo gồm đầu ưa nước và đuôi kị nước (ưa dầu mỡ). Vai trò của đuôi kị nước (gốc hydrocarbon) trong quá trình giặt rửa là", "o": ["thâm nhập và hòa tan vào vết bẩn dầu mỡ trên bề mặt sợi vải.", "liên kết chặt chẽ với các phân tử nước để kéo vết bẩn ra ngoài.", "phản ứng hóa học với các ion Ca<sup>2+<\/sup> và Mg<sup>2+<\/sup> trong nước cứng.", "tạo môi trường kiềm giúp thủy phân hoàn toàn vết bẩn dầu mỡ."], "a": 0}, {"n": 41, "stem": "Trong dân gian, người ta thường dùng quả bồ kết, quả bồ hòn hoặc lá cây ngũ sắc để gội đầu và giặt quần áo. Các chất giặt rửa tự nhiên này có chứa hợp chất nào sau đây có khả năng tạo bọt và tẩy rửa sạch dầu mỡ?", "o": ["Saponin.", "Glycerol.", "Glucose.", "Cellulose."], "a": 0}, {"n": 42, "stem": "Nguyên nhân chính giúp chất giặt rửa tổng hợp (chứa muối sodium alkylsulfate R-O-SO<sub>3<\/sub>Na hoặc sodium alkylbenzenesulfonate R-C<sub>6<\/sub>H<sub>4<\/sub>-SO<sub>3<\/sub>Na) giặt rửa hiệu quả trong nước cứng (chứa nhiều ion Ca<sup>2+<\/sup> và Mg<sup>2+<\/sup>), trong khi xà phòng truyền thống bị mất tác dụng là do", "o": ["muối calcium và magnesium của chất giặt rửa tổng hợp tan được trong nước, không tạo kết tủa bám vào vải.", "chất giặt rửa tổng hợp làm giảm độ cứng của nước bằng cách kết tủa hoàn toàn ion Ca<sup>2+<\/sup>.", "chất giặt rửa tổng hợp có môi trường acid làm hòa tan các muối calcium.", "xà phòng bị oxi hóa bởi các ion Ca<sup>2+<\/sup> và Mg<sup>2+<\/sup> tạo thành khí độc hại."], "a": 0}, {"n": 43, "stem": "Cho các phát biểu sau về xà phòng, chất giặt rửa tự nhiên và chất giặt rửa tổng hợp: (1) Phân tử xà phòng và chất giặt rửa tổng hợp đều có cấu tạo hai phần: đầu ưa nước và đuôi kị nước. (2) Chất giặt rửa tự nhiên như saponin trong quả bồ kết thân thiện với môi trường và an toàn cho da tay. (3) Dùng xà phòng để giặt quần áo trong nước cứng sẽ làm sợi vải bị cứng, hoen ố do xuất hiện kết tủa (RCOO)<sub>2<\/sub>Ca và (RCOO)<sub>2<\/sub>Mg. (4) Chất giặt rửa tổng hợp ngày nay thường được sản xuất với gốc hydrocarbon mạch không phân nhánh (mạch thẳng) để dễ bị vi sinh vật phân hủy sinh học. (5) Xà phòng và chất giặt rửa tổng hợp có công thức hóa học và phương pháp sản xuất hoàn toàn giống nhau. Số phát biểu ĐÚNG là", "o": ["4.", "3.", "2.", "5."], "a": 0}, {"n": 44, "stem": "Trong cuộc sống hằng ngày, khi giặt quần áo bằng xà phòng truyền thống (muối sodium của acid béo), người ta được khuyên KHÔNG nên dùng nước giặt là nước cứng (nước chứa nhiều ion Ca<sup>2+<\/sup>, Mg<sup>2+<\/sup>). Nguyên nhân chính là do", "o": ["các ion Ca<sup>2+<\/sup>, Mg<sup>2+<\/sup> tác dụng với xà phòng tạo kết tủa làm cứng sợi vải, hoen ố quần áo và lãng phí xà phòng.", "nước cứng hòa tan hoàn toàn xà phòng làm xà phòng không tạo bọt được.", "nước cứng làm xà phòng bị phân hủy thành khí độc hại gây hư hỏng sợi vải.", "các ion Ca<sup>2+<\/sup>, Mg<sup>2+<\/sup> phản ứng với xà phòng sinh ra acid mạnh làm ăn mòn da tay."], "a": 0}, {"n": 45, "stem": "Để bảo vệ môi trường sinh thái sông hồ và nguồn nước sinh hoạt, các nhà sản xuất hóa chất hiện nay được khuyến cáo nên ưu tiên sản xuất các loại chất giặt rửa tổng hợp có cấu tạo phân tử như thế nào?", "o": ["Có gốc hydrocarbon mạch không phân nhánh (mạch thẳng) để các vi sinh vật trong tự nhiên dễ dàng phân hủy sinh học.", "Có gốc hydrocarbon mạch phân nhánh phức tạp để tăng độ bền của bọt xà phòng.", "Chứa nhiều nguyên tố kim loại nặng như chì, thủy ngân để tăng khả năng diệt khuẩn.", "Có chứa nhóm chức ester dễ bay hơi trong không khí để không đọng lại trong nước."], "a": 0}, {"n": 46, "stem": "Đối với các loại quần áo may bằng vải lụa tơ tằm, tơ nhân tạo hoặc đồ len đắt tiền, cách giặt rửa nào sau đây là hợp lý và an toàn nhất để tránh làm mục và hỏng sợi vải?", "o": ["Dùng chất giặt rửa nhẹ hoặc trung tính (như nước giặt chuyên dụng, bồ kết) và giặt nhẹ bằng tay.", "Dùng xà phòng có độ kiềm rất cao và đun sôi quần áo trong nước xà phòng.", "Ngâm quần áo trong dung dịch chất tẩy rửa chứa chlorine (như nước Javel) đậm đặc trước khi giặt.", "Dùng bột giặt tẩy mạnh chứa nhiều chất chà xát cơ học và vò thật mạnh."], "a": 0}, {"n": 47, "stem": "Chất nào sau đây thuộc loại monosaccharide?", "o": ["Saccharose.", "Cellulose.", "Tinh bột.", "Glucose."], "a": 3}, {"n": 48, "stem": "Carbohydrate nào sau đây thuộc loại polysaccharide?", "o": ["Saccharose.", "Cellulose.", "Fructose.", "Glucose."], "a": 1}, {"n": 49, "stem": "Chất nào sau đây thuộc loại disaccharide?", "o": ["Cellulose.", "Saccharose.", "Glucose.", "Fructose."], "a": 1}, {"n": 50, "stem": "Cho 4 carbohydrate sau: glucose, fructose, maltose, saccharose .Có bao nhiêu carbohydrate đã cho thuộc nhóm disaccharide?", "o": ["1.", "2.", "3.", "4."], "a": 1}, {"n": 51, "stem": "Glucose là một loại monosaccharide có nhiều trong quả nho chín. Công thức phân tử của glucose là", "o": ["C<sub>2<\/sub>H<sub>4<\/sub>O<sub>2<\/sub>.", "(C<sub>6<\/sub>H<sub>10<\/sub>O<sub>5<\/sub>)n.", "C<sub>12<\/sub>H<sub>22<\/sub>O<sub>11<\/sub>.", "C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub>."], "a": 3}, {"n": 52, "stem": "Fructose là một loại monosaccharide có nhiều trong mật ong, có vị ngọt sắC. Công thức phân tử của fructose là", "o": ["C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub>.", "(C<sub>6<\/sub>H<sub>10<\/sub>O<sub>5<\/sub>)n.", "C<sub>2<\/sub>H<sub>4<\/sub>O<sub>2<\/sub>.", "C<sub>12<\/sub>H<sub>22<\/sub>O<sub>11<\/sub>."], "a": 0}, {"n": 53, "stem": "Cellulose thuộc loại polysaccharide, là thành phần chính tạo nên màng tế bào thực vật, có nhiều trong gỗ, bông nõn. Công thức của cellulose là", "o": ["(C<sub>6<\/sub>H<sub>10<\/sub>O<sub>5<\/sub>)n.", "C<sub>12<\/sub>H<sub>22<\/sub>O<sub>11<\/sub>.", "C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub>.", "C<sub>2<\/sub>H<sub>4<\/sub>O<sub>2<\/sub>."], "a": 0}, {"n": 55, "stem": "Dung dịch nào sau đây có phản ứng tráng bạc?", "o": ["Methyl acetate.", "Glycine.", "Fructose.", "Saccharose."], "a": 2}, {"n": 56, "stem": "Dung dịch chất nào sau đây hòa tan Cu(OH)<sub>2<\/sub>, thu được dung dịch có màu xanh lam?", "o": ["Fructose.", "Propyl alcohol.", "Anbumin.", "Propan-1,3-diol."], "a": 0}, {"n": 57, "stem": "Chất nào sau đây không thủy phân trong môi trường acid?", "o": ["Cellulose.", "Saccharose.", "Tinh bột.", "Glucose."], "a": 3}, {"n": 58, "stem": "Fructose không phản ứng được với chất nào sau đây?", "o": ["Cu(OH)<sub>2<\/sub> ở nhiệt độ thường.", "Nước bromine.", "Cu(OH)<sub>2<\/sub> ở nhiệt độ cao.", "Dung dịch AgNO<sub>3<\/sub>/NH<sub>3<\/sub>, to."], "a": 1}, {"n": 59, "stem": "Chất thuộc loại disaccharide là", "o": ["glucose.", "saccharose.", "cellulose.", "fructose."], "a": 1}, {"n": 60, "stem": "Đường mía là loại đường nào sau đây?", "o": ["Maltose.", "Glucose.", "Fructose.", "Saccharose."], "a": 3}, {"n": 61, "stem": "Phân tử saccharose được tạo bởi", "o": ["một gốc glucose và một gốc maltose.", "hai gốc fructose.", "một gốc glucose và một gốc fructose.", "hai gốc glucose."], "a": 2}, {"n": 62, "stem": "Phân tử maltose được tạo bởi", "o": ["một gốc glucose và một gốc maltose.", "hai gốc fructose.", "một gốc glucose và một gốc fructose.", "hai gốc glucose."], "a": 3}, {"n": 63, "stem": "Có các phản ứng sau: phản ứng tráng gương (1); phản ứng với I<sub>2<\/sub> (2); phản ứng với Cu(OH)<sub>2<\/sub> tạo dung dịch xanh lam (3); phản ứng thuỷ phân (4); phản ứng ester hóa (5). Tinh bột có phản ứng nào trong các phản ứng trên?", "o": ["(2), (4).", "(1), (2), (4).", "(2), (4), (5).", "(2), (3), (4)."], "a": 0}, {"n": 64, "stem": "Tinh bột, cellulose, saccharose đều có khả năng tham gia phản ứng", "o": ["hoà tan Cu(OH)<sub>2<\/sub>.", "trùng ngưng.", "tráng gương.", "thủy phân."], "a": 3}, {"n": 65, "stem": "Cho một số tính chất: có dạng sợi (1); tan trong nước (2); tan trong nước Schweizer (3); phản ứng với nitric acid đặc (xúc tác sulfuric acid đặc) (4); tham gia phản ứng tráng bạc (5); bị thủy phân trong dung dịch acid đun nóng (6). Các tính chất của cellulose là", "o": ["(3), (4), (5) và (6).", "(1), (3), (4) và (6).", "(1), (2), (3) và (4).", "(2), (3), (4) và (5)."], "a": 1}, {"n": 66, "stem": "Tiến hành thí nghiệm về phản ứng của saccharose với copper(II) hydroxide theo các bước sau: • Bước 1: Cho khoảng 2 mL dung dịch NaOH 10% vào ống nghiệm sạch. Thêm tiếp khoảng 0,5 mL dung dịch CuSO<sub>4<\/sub> 5% vào, lắc nhẹ. • Bước 2: Cho khoảng 3 mL dung dịch saccharose 5% vào ống nghiệm, lắc đều. Hiện tượng quan sát được sau Bước 2 là", "o": ["xuất hiện kết tủa màu đỏ gạch Cu<sub>2<\/sub>O ở đáy ống nghiệm.", "kết tủa Cu(OH)<sub>2<\/sub> màu xanh nhạt bị hòa tan, tạo thành dung dịch có màu xanh lam thẫm.", "xuất hiện lớp chất lỏng phân thành 2 lớp không màu.", "dung dịch có sủi bọt khí không màu thoát ra rầm rộ."], "a": 1}, {"n": 67, "stem": "Thí nghiệm cho dung dịch saccharose tác dụng với kết tủa Cu(OH)<sub>2<\/sub> tươi ở nhiệt độ phòng nhằm mục đích chính là chứng minh", "o": ["trong phân tử saccharose có chứa nhóm chức aldehyde (-CHO).", "saccharose có khả năng tham gia phản ứng thủy phân trong môi trường kiềm.", "phân tử saccharose chứa nhiều nhóm hydroxy (-OH) kề nhau (tính chất polyalcohol).", "saccharose là một disaccharide được tạo bởi 2 đơn vị monosaccharide."], "a": 2}, {"n": 68, "stem": "Tiến hành thí nghiệm hòa tan Cu(OH)<sub>2<\/sub> bằng dung dịch saccharose 5% thu được dung dịch màu xanh lam thẫm. Nếu tiếp tục đun nóng nhẹ ống nghiệm này trên ngọn lửa đèn cồn thì hiện tượng quan sát được là", "o": ["dung dịch chuyển sang màu tím đặc trưng của phản ứng biuret.", "xuất hiện kết tủa màu đỏ gạch Cu<sub>2<\/sub>O lắng xuống đáy ống nghiệm.", "dung dịch vẫn giữ nguyên màu xanh lam thẫm, không xuất hiện kết tủa đỏ gạch.", "dung dịch lập tức bị mất màu hoàn toàn trở nên trong suốt."], "a": 2}, {"n": 69, "stem": "Tiến hành thí nghiệm phản ứng của saccharose với Cu(OH)<sub>2<\/sub> theo quy trình: • Bước 1: Cho 2 mL dung dịch NaOH 10% và 0,5 mL dung dịch CuSO<sub>4<\/sub> 5% vào ống nghiệm, lắc nhẹ thu được kết tủa xanh lam. • Bước 2: Rót 3 mL dung dịch saccharose 5% vào ống nghiệm, lắc đều. Phát biểu nào sau đây SAI khi nói về thí nghiệm trên?", "o": ["Ở Bước 1, xảy ra phản ứng trao đổi tạo kết tủa Cu(OH)<sub>2<\/sub> màu xanh lam.", "Ở Bước 2, dung dịch thu được có màu xanh lam thẫm do tạo phức chất copper(II) saccharate.", "Nếu thay dung dịch NaOH ở Bước 1 bằng dung dịch KOH thì hiện tượng thu được ở Bước 2 vẫn tương tự.", "Ở Bước 2, nếu đun nóng ống nghiệm sẽ thu được kết tủa màu đỏ gạch Cu<sub>2<\/sub>O."], "a": 3}, {"n": 70, "stem": ". Khi thủy phân hoàn toàn tinh bột ((C<sub>6<\/sub>H<sub>10<\/sub>O<sub>5<\/sub>)n) trong môi trường acid (H<sub>2<\/sub>SO<sub>4<\/sub> loãng, đun nóng) hoặc nhờ xúc tác enzyme (amylase), sản phẩm cuối cùng thu được duy nhất là", "o": ["glucose.", "fructose.", "saccharose.", "maltose ."], "a": 0}, {"n": 71, "stem": "Để nhận biết dung dịch hồ tinh bột ở nhiệt độ phòng, người ta thường dùng dung dịch iodine (I<sub>2<\/sub>). Hiện tượng đặc trưng quan sát được là dung dịch xuất hiện màu", "o": ["xanh tím (xanh thẫm).", "đỏ gạch.", "vàng nhạt.", "hồng tím."], "a": 0}, {"n": 72, "stem": "Cho cellulose tác dụng với dung dịch HNO<sub>3<\/sub> đặc có xúc tác H<sub>2<\/sub>SO<sub>4<\/sub> đặc, đun nóng thu được hợp chất cellulose trinitrate [C<sub>6<\/sub>H<sub>7<\/sub>O<sub>2<\/sub>(ONO<sub>2<\/sub>)<sub>3<\/sub>]n. Hợp chất này có ứng dụng quan trọng là dùng để", "o": ["sản xuất thuốc súng không khói.", "chế tạo tơ visco.", "làm chất dẻo tổng hợp PVC.", "sản xuất phân bón hóa học."], "a": 0}, {"n": 73, "stem": "Saccharose (đường mía) là một disaccharide phổ biến trong tự nhiên. Đặc điểm cấu tạo phân tử nào sau đây của saccharose là ĐÚNG?", "o": ["Phân tử gồm 1 đơn vị α-glucose và 1 đơn vị β-fructose liên kết với nhau qua liên kết α-1,2-glycoside.", "Phân tử gồm 2 đơn vị α-glucose liên kết với nhau qua liên kết α-1,4-glycoside.", "Phân tử chứa nhóm hydroxy (-OH) hemiacetal tự do nên có khả năng mở mạch vòng thành dạng aldehyde.", "Phân tử gồm 1 đơn vị β-glucose và 1 đơn vị α-fructose liên kết qua liên kết β-1,4-glycoside."], "a": 0}, {"n": 74, "stem": "Cellulose là thành phần chính tạo nên màng tế bào thực vật. Phân tử cellulose có công thức cấu tạo thu gọn là [C<sub>6<\/sub>H<sub>7<\/sub>O<sub>2<\/sub>(OH)<sub>3<\/sub>]n. Đặc điểm cấu tạo phân tử của cellulose là", "o": ["gồm nhiều đơn vị β-glucose liên kết với nhau qua liên kết β-1,4-glycoside tạo thành chuỗi mạch thẳng không phân nhánh và mỗi mắt xích C<sub>6<\/sub>H<sub>10<\/sub>O<sub>5<\/sub> chứa 3 nhóm -OH tự do.", "gồm các đơn vị α-glucose liên kết với nhau tạo thành chuỗi xoắn phân nhánh.", "gồm các đơn vị fructose liên kết với nhau qua cầu nối glycoside không phân nhánh.", "chứa các nhóm -OH hemiacetal tự do ở đầu chuỗi polymer nên có tính khử mạnh."], "a": 0}, {"n": 75, "stem": "Cho các phát biểu sau về đặc điểm cấu tạo và tên gọi của một số carbohydrate: (1) Saccharose được gọi là đường mía, được tạo bởi 1 gốc α-glucose và 1 gốc β-fructose. (2) Maltose được gọi là đường mạch nha, phân tử chứa 2 gốc α-glucose liên kết α-1,4-glycoside. (3) Amylose trong tinh bột có cấu trúc mạch thẳng không phân nhánh và bị xoắn lại. (4) Cellulose có cấu trúc mạch phân nhánh do chứa các liên kết β-1,6-glycoside. (5) Phân tử saccharose không còn nhóm -OH hemiacetal tự do nên không có dạng mạch hở. Số phát biểu ĐÚNG là", "o": ["4.", "3.", "2.", "5."], "a": 0}, {"n": 76, "stem": "Công thức chung của amine no, đơn chức, mạch hở là", "o": ["CnH<sub>2n-5<\/sub>N (n ≥ 6).", "CnH<sub>2n+1<\/sub>N (n ≥ 2).", "CnH<sub>2n-1<\/sub>N (n ≥ 2).", "CnH<sub>2n+3<\/sub>N (n ≥1)."], "a": 3}, {"n": 77, "stem": "Chất nào sau đây thuộc loại amine bậc ba?", "o": ["C<sub>2<\/sub>H<sub>5<\/sub>-NH<sub>2<\/sub>.", "(CH<sub>3<\/sub>)<sub>3<\/sub>N.", "CH<sub>3<\/sub>-NH-CH<sub>3<\/sub>.", "CH<sub>3<\/sub>-NH<sub>2<\/sub>."], "a": 1}, {"n": 78, "stem": "Chất nào sau đây thuộc loại amine bậc ba?", "o": ["Triolein.", "Trimethylamine.", "Dimethylamine.", "Methylamine."], "a": 1}, {"n": 79, "stem": "Số amine thơm bậc một ứng với công thức phân tử C<sub>7<\/sub>H<sub>9<\/sub>N là", "o": ["3.", "2.", "5.", "4."], "a": 0}, {"n": 80, "stem": "Trong các chất dưới đây, chất nào là amine bậc hai?", "o": ["H<sub>2<\/sub>N[CH<sub>2<\/sub>]6NH<sub>2<\/sub>.", "(CH<sub>3<\/sub>)<sub>2<\/sub>CHNH<sub>2<\/sub>.", "CH<sub>3<\/sub>NHCH<sub>3<\/sub>.", "C<sub>6<\/sub>H<sub>5<\/sub>NH<sub>2<\/sub>."], "a": 2}, {"n": 81, "stem": "Chất nào sau đây là amine bậc một?", "o": ["CH<sub>3<\/sub>NHC<sub>2<\/sub>H<sub>5<\/sub>.", "(CH<sub>3<\/sub>)<sub>2<\/sub>NH.", "(C<sub>2<\/sub>H<sub>5<\/sub>)<sub>3<\/sub>N.", "C<sub>6<\/sub>H<sub>5<\/sub>NH<sub>2<\/sub>."], "a": 3}, {"n": 82, "stem": "Chất nào sau đây thuộc loại amine bậc một?", "o": ["Triolein.", "Trimethylamine.", "Dimethylamine.", "Methylamine"], "a": 3}, {"n": 83, "stem": "Công thức phân tử của dimethylamine là", "o": ["C<sub>2<\/sub>H<sub>8<\/sub>N<sub>2<\/sub>.", "C<sub>2<\/sub>H<sub>7<\/sub>N.", "C<sub>4<\/sub>H<sub>11<\/sub>N", "C<sub>2<\/sub>H<sub>6<\/sub>N<sub>2<\/sub>."], "a": 1}, {"n": 84, "stem": "Công thức phân tử của ethylamine là", "o": ["C<sub>4<\/sub>H<sub>11<\/sub>N.", "CH<sub>5<\/sub>N.", "C<sub>3<\/sub>H<sub>9<\/sub>N.", "C<sub>2<\/sub>H<sub>7<\/sub>N."], "a": 3}, {"n": 85, "stem": "Chất X có công thức CH<sub>3<\/sub>NH<sub>2<\/sub>. Tên gọi của X là", "o": ["trimethylamine.", "ethylamine.", "methylamine.", "dimethylamine."], "a": 2}, {"n": 86, "stem": "Hợp chất C<sub>2<\/sub>H<sub>5<\/sub>NHC<sub>2<\/sub>H<sub>5<\/sub> có tên là", "o": ["ethylmethylamine.", "dimethylamine.", "propylamine.", "diethylamine."], "a": 3}, {"n": 87, "stem": "Hợp chất CH<sub>3<\/sub>NHCH<sub>3<\/sub> có tên là", "o": ["propylamine.", "diethylamine.", "ethylmethylamine.", "dimethylamine."], "a": 3}, {"n": 88, "stem": "Tên gọi và bậc của amine có công thức cấu tạo CH<sub>3<\/sub>CH<sub>2<\/sub>CH(CH<sub>3<\/sub>)CH<sub>2<\/sub>-NH<sub>2<\/sub> là", "o": ["3-methylbutan-4-amine, bậc một.", "2-methylbutan-l-amine, bậc hai.", "3-methylbutan-4-amine, bậc hai.", "2-methylbutan-l-amine, bậc một."], "a": 3}, {"n": 89, "stem": "Ở điều kiện thường, các amino acid tồn tại chủ yếu ở dạng trạng thái vật lí nào sau đây?", "o": ["Chất lỏng không màu, dễ bay hơi và có mùi xóc.", "Chất rắn dạng tinh thể không màu, có nhiệt độ nóng chảy tương đối cao.", "Chất khí không màu, nhẹ hơn không khí và có mùi khai.", "Chất vô định hình màu vàng nhạt, không tan trong nước."], "a": 1}, {"n": 90, "stem": "Đa số các amino acid đều là chất rắn tinh thể, dễ tan trong nước và có nhiệt độ nóng chảy tương đối cao. Nguyên nhân chính của đặc điểm vật lí này là do trong tinh thể và dung dịch, phân tử amino acid", "o": ["tồn tại chủ yếu ở dạng ion lưỡng cực.", "liên kết với nhau bằng các liên kết cộng hóa trị không phân cực rất bền vững.", "có khối lượng phân tử rất lớn tương tự như các hợp chất polymer sinh học.", "chứa nhóm amine có tính base mạnh và nhóm carboxyl có tính acid mạnh tồn tại hoàn toàn độc lập."], "a": 0}, {"n": 91, "stem": "Phát biểu nào sau đây là SAI khi nói về tính chất vật lí của amino acid?", "o": ["Các amino acid là những chất rắn ở điều kiện thường.", "Tinh thể amino acid có nhiệt độ nóng chảy cao và thường bị phân hủy khi nóng chảy.", "Các amino acid đều rất khó tan trong nước nhưng tan tốt trong các dung môi hữu cơ không cựC.", "Hầu hết các amino acid (như glycine, alanine, valine) đều có vị ngọt nhất định."], "a": 2}, {"n": 92, "stem": "Amino acid đơn giản nhất có công thức cấu tạo thu gọn là H<sub>2<\/sub>N-CH<sub>2<\/sub>-COOH. Tên thay thế (danh pháp IUPAC) của hợp chất này là", "o": ["acid 2-aminoethanoic.", "acid  α-aminoacetic.", "glycine.", "acid  2-aminopropanoic."], "a": 0}, {"n": 93, "stem": "Alanine (kí hiệu là Ala) là một α-amino acid phổ biến trong cấu trúc protein. Công thức cấu tạo thu gọn của alanine là CH<sub>3<\/sub>-CH(NH<sub>2<\/sub>)-COOH. Tên bán hệ thống của alanine là", "o": ["axit α-aminopropionic.", "axit α-aminoacetic.", "axit α-aminoglutaric.", "axit α-aminoisovaleric."], "a": 0}, {"n": 94, "stem": "Valine (kí hiệu là Val) là một amino acid thiết yếu có công thức cấu tạo thu gọn là (CH<sub>3<\/sub>)<sub>2<\/sub>CH-CH(NH<sub>2<\/sub>)-COOH. Tên thay thế theo danh pháp IUPAC của valine là", "o": ["axit 2-amino-3-methylbutanoic.", "axit 2-aminopentanoic.", "axit 2-amino-3-methylpropanoic.", "axit 2,6-diaminohexanoic."], "a": 0}, {"n": 95, "stem": "Amino acid là loại hợp chất hữu cơ tạp chức mà trong phân tử chứa đồng thời hai nhóm chức đặc trưng nào sau đây?", "o": ["Nhóm carboxyl (-COOH) và nhóm hydroxy (-OH).", "Nhóm amino (-NH<sub>2<\/sub>) và nhóm carboxyl (-COOH).", "Nhóm amino (-NH<sub>2<\/sub>) và nhóm aldehyde (-CHO).", "Nhóm carboxyl (-COOH) và nhóm ester (-COOR)."], "a": 1}, {"n": 96, "stem": "Các amino acid thiên nhiên hầu hết là các α-amino acid có công thức cấu tạo chung dạng H<sub>2<\/sub>N-CH(R)-COOH. Vị trí α trong phân tử amino acid chỉ nguyên tử carbon nào sau đây?", "o": ["Nguyên tử carbon trong nhóm carboxyl (-COOH).", "Nguyên tử carbon liên kết trực tiếp với nhóm carboxyl (-COOH) (C số 2 trong mạch chính).", "Nguyên tử carbon ở cuối mạch hydrocarbon.", "Nguyên tử carbon liên kết với nhóm amino ở vị trí C số 3."], "a": 1}, {"n": 97, "stem": "Cho các amino acid thông dụng sau: glycine (Gly), alanine (Ala), valine (Val), glutamic acid (Glu) và lysine (Lys). Phát biểu nào sau đây đúng về tỉ lệ số nhóm -NH<sub>2<\/sub> và số nhóm -COOH trong phân tử của chúng?    A. Gly, Ala, Val đều chứa 1 nhóm -NH<sub>2<\/sub> và 1 nhóm -COOH; Glu chứa 1 nhóm -NH<sub>2<\/sub> và 2 nhóm -COOH; Lys chứa 2 nhóm -NH<sub>2<\/sub> và 1 nhóm -COOH.    B. Cả 5 amino acid trên đều chứa 1 nhóm -NH<sub>2<\/sub> và 1 nhóm -COOH.    C. Glu chứa 2 nhóm -NH<sub>2<\/sub> và 1 nhóm -COOH, còn Lys chứa 1 nhóm -NH<sub>2<\/sub> và 2 nhóm -COOH.    D. Gly chứa 2 nhóm -NH<sub>2<\/sub> và 1 nhóm -COOH; Lys và Glu chứa 1 nhóm -NH<sub>2<\/sub> và 1 nhóm -COOH. Câu 98 . Amino acid vừa có khả năng tác dụng với dung dịch acid mạnh (như HCl) vừa có khả năng tác dụng với dung dịch base mạnh (như NaOH). Tính chất này chứng minh phân tử amino acid có    A. tính chất lưỡng tính.       B. tính kiềm mạnh.       C. tính acid yếu.       D. tính chất trung tính hoàn toàn. Câu 99 . Cho 0,1 mol glycine (H<sub>2<\/sub>N-CH<sub>2<\/sub>-COOH) tác dụng vừa đủ với dung dịch chứa 0,1 mol HCl thu được dung dịch X. Cho toàn bộ dung dịch X tác dụng hoàn toàn với dung dịch chứa m mol NaOH. Giá trị số mol NaOH (m) phản ứng vừa đủ là", "o": ["0,2 mol.", "0,1 mol.", "0,3 mol.", "0,15 mol."], "a": 0}, {"n": 101, "stem": "Cho dung dịch chứa amino acid X tồn tại ở dạng ion lưỡng cực:  Đặt dung dịch này trong một điện trường. Khi đó:", "o": ["Chất X sẽ di chuyển về phía cực âm của điện trường.", "Chất X sẽ di chuyển về phía cực dương của điện trường.", "Chất X không di chuyển dưới tác dụng của điện trường.", "Chất X chuyển hoàn toàn về dạng H<sub>2<\/sub>NCH(R)COOH."], "a": 2, "img": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAIsAAAA9CAIAAAAS6A3AAAAAAXNSR0IArs4c6QAAC2dJREFUeF7tnGWMFEsQgN/B4e7uFtw1uEtwDS7BXYMnWHDX4MGd4MEhwT24OzzcXd+XdN6kmdmd69mb3Z3jdn5cbntrqqvLq7t6g37//v1P4HEwByJ4ibYbN268evXKS8jDFVpvSejw4cMPHz4MV6z00mK9JSEvkRsO0QYk5HShB9mYKdy9e3fRokVixefOnUuWLFmSJEnEx4EDB0aJEsXpzHAkfXba0Ldv3/79/3n79m2LFi369OnTpUuX3LlzR44c2ZHLDwNE2WlD8nIXL16cL1++XLlyOYQHT548iRQpUoIECRxCjzoZdtqQ+qy+h4wYMWKECGF t béo bằng dung dịch NaOH là phản ứng thuận nghịch hai chiều.", "Việc áp dụng tỷ lệ superfat 5% – 8% (dùng dư chất béo) giúp đảm bảo sản phẩm xà phòng không chứa NaOH tự do gây kích ứng da.", "Chỉ số xà phòng hóa của dầu ăn đại diện cho số miligam KOH (hoặc NaOH) cần thiết để xà phòng hóa hoàn toàn 1 gram chất béo.", "Trong cấu tạo muối sodium carboxylate của xà phòng, gốc hydrocarbon R- đóng vai trò là đầu ưa nước, liên kết mạnh với các phân tử nước."], "a": [false, true, true, false], "img": []}, {"n": 2, "stem": "", "s": ["Phương trình xà phòng hóa triolein: (C<sub>17<\/sub>H<sub>33<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub> + 3NaOH → 3C<sub>17<\/sub>H<sub>33<\/sub>COONa + C<sub>3<\/sub>H<sub>5<\/sub>(OH)<sub>3<\/sub>.", "Khối lượng triolein nguyên chất có trong 200g dầu ăn thừa trên là 176,8 gram.", "Khối lượng NaOH lý thuyết phản ứng vừa đủ với lượng triolein trên là 24,0 gram.", "Nếu áp dụng tỷ lệ superfat 5% (dùng dư chất béo) . khối lượng NaOH thực tế cần cân là 25,2 gram."], "a": [true, true, true, false], "img": []}, {"n": 4, "stem": "Xà phòng và chất giặt rửa tổng hợp là hai loại chất hoạt động bề mặt được ứng dụng phổ biến trong đời sống.", "s": ["Xà phòng là hỗn hợp các muối sodium hoặc potassium của acid béo, thường có thêm một số chất phụ gia.", "Phản ứng xà phòng hóa chất béo trong dung dịch NaOH đun nóng là phản ứng một chiều, thu được sản phẩm gồm muối sodium của acid béo (thành phần chính của xà phòng) và glycerol.", "Phân tử xà phòng có cấu tạo gồm hai phần: đầu ưa nước là nhóm -COONa (hoặc -COOK) phân cực và đuôi kị nước (ưa dầu mỡ) là gốc hydrocarbon mạch dài không phân cực.", "Khi dùng xà phòng để giặt quần áo trong nước cứng (chứa nhiều ion Ca<sup>2+<\/sup>, Mg<sup>2+<\/sup>), xà phòng bị mất tác dụng giặt rửa và làm cứng sợi vải do sinh ra các muối kết tủa không tan như (C<sub>17<\/sub>H<sub>35<\/sub>COO)₂Ca."], "a": [true, true, true, true], "img": []}, {"n": 5, "stem": "Từ xa xưa, nhân dân ta đã biết dùng quả bồ kết, quả bồ hòn để gội đầu và giặt quần áo. Ngày nay, các sản phẩm giặt rửa có nguồn gốc tự nhiên đang ngày càng được ưa chuộng bên cạnh các loại xà phòng và chất giặt rửa tổng hợp.", "s": ["Quả bồ kết, quả bồ hòn chứa hợp chất saponin, thuộc loại chất giặt rửa tự nhiên.", "Saponin trong quả bồ kết có khả năng giặt rửa sạch dầu mỡ tương tự xà phòng nhưng trong thành phần hóa học hoàn toàn không chứa muối sodium của acid béo.", "Cơ chế giặt rửa của saponin hay xà phòng đều dựa trên khả năng làm giảm lực căng bề mặt của nước và nhũ tương hóa vết bẩn dầu mỡ thành các hạt cực nhỏ (micelle) lơ lửng trong nước để rửa trôi.", "Đối với các loại trang phục cao cấp may bằng lụa tơ tằm tự nhiên hoặc đồ len đắt tiền, việc giặt bằng xà phòng có độ kiềm cao sẽ giúp bảo vệ sợi vải tốt hơn so với việc dùng chất giặt rửa tự nhiên hoặc nước giặt trung tính."], "a": [true, true, true, false], "img": []}, {"n": 6, "stem": "Xà phòng và chất giặt rửa tổng hợp là hai loại chất hoạt động bề mặt được ứng dụng phổ biến trong đời sống. Việc hiểu rõ cấu tạo phân tử và đặc tính của từng loại giúp người tiêu dùng lựa chọn phương pháp sử dụng tối ưu.", "s": ["Thành phần chính của xà phòng cứng thương phẩm thường là muối sodium stearate (C<sub>17<\/sub>H<sub>35<\/sub>COONa) hoặc sodium palmitate (C<sub>15<\/sub>H<sub>31<\/sub>COONa).", "Xà phòng và chất giặt rửa tổng hợp đều có tác dụng làm giảm lực căng bề mặt của nước, giúp nước dễ thấm ướt bề mặt sợi vải và vật dụng cần làm sạch.", "Khi cho xà phòng vào nước chứa vết dầu mỡ và vò nhẹ, các phân tử xà phòng sẽ quay đầu ưa nước (-COO-) chui vào trong giọt dầu mỡ và chĩa đuôi kị nước (gốc hydrocarbon) ra ngoài tiếp xúc với nước.", "Khi sử dụng máy giặt cửa trước (máy giặt lồng ngang), người dùng được khuyến cáo nên chọn loại nước giặt hoặc bột giặt chuyên dụng ít tạo bọt để tránh bọt xà phòng trào ra ngoài gây hư hỏng mạch điện và động cơ của máy."], "a": [true, true, false, true], "img": []}, {"n": 7, "stem": "Glucose và fructose là hai monosaccharide phổ biến nhất trong tự nhiên, có công thức phân tử C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub>, giữ vai trò cung cấp năng lượng quan trọng cho cơ thể sinh vật và là nguyên liệu trong công nghiệp thực phẩm.", "s": ["Ở dạng mạch hở, phân tử glucose là một polyhydroxy aldehyde chứa 5 nhóm -OH và 1 nhóm -CHO; còn phân tử fructose là một polyhydroxy ketone chứa 5 nhóm -OH và 1 nhóm -C=O ở vị trí C<sub>2<\/sub>.", "Ở nhiệt độ thường, cả dung dịch glucose và fructose đều có khả năng hòa tan kết tủa Cu(OH)<sub>2<\/sub> tạo thành dung dịch phức chất màu xanh lam thẫm do phân tử có chứa nhiều nhóm -OH kề nhau.", "Trong môi trường acid mạnh, fructose chuyển hóa hoàn toàn thành glucose nên fructose có thể tham gia phản ứng tráng bạc với dung dịch AgNO<sub>3<\/sub> trong HCl.", "Để phân biệt hai dung dịch riêng biệt mất nhãn gồm glucose và fructose trong phòng thí nghiệm, học sinh có thể dùng thuốc thử là dung dịch nước bromine; khi đó, lọ đựng glucose sẽ làm mất màu nước bromine, còn lọ đựng fructose không làm mất màu nước bromine."], "a": [true, true, false, true], "img": []}, {"n": 8, "stem": "Trong dung dịch nước, phân tử glucose chủ yếu tồn tại ở dạng mạch vòng 6 cạnh (α-glucose và β-glucose) cân bằng thuận nghịch với một lượng rất nhỏ dạng mạch hở.", "s": ["Dạng mạch vòng 6 cạnh của glucose được hình thành do sự tương tác nội phân tử giữa nhóm -OH ở vị trí C<sub>5<\/sub> với nhóm -CHO ở vị trí C<sub>1<\/sub>, tạo ra nhóm -OH hemiacetal tự do tại C<sub>1<\/sub>.", "Khi cho glucose dạng mạch vòng tác dụng với CH<sub>3<\/sub>OH có mặt khí HCl khô làm xúc tác, tất cả 5 nhóm -OH trong phân tử glucose đều bị ether hóa tạo thành penta-methyl ether.", "Hợp chất methyl glucoside vừa sinh ra do nhóm -OH hemiacetal ở C<sub>1<\/sub> đã chuyển thành nhóm -OCH<sub>3<\/sub> nên vòng không thể mở ra dạng mạch hở được nữa, do đó hợp chất này không tham gia phản ứng tráng bạc với thuốc thử Tollens.", "Trong thí nghiệm tráng bạc của glucose, nếu cho trực tiếp dung dịch AgNO<sub>3<\/sub> vào dung dịch glucose rồi đun nóng (không thêm dung dịch NH<sub>3<\/sub>) thì vẫn thu được lớp kim loại bạc sáng bóng bám trên thành ống nghiệm."], "a": [true, false, true, false], "img": []}, {"n": 9, "stem": "Trong phòng thí nghiệm, phản ứng của glucose với Cu(OH)<sub>2<\/sub> được tiến hành ở hai điều kiện nhiệt độ khác nhau (nhiệt độ phòng và đun nóng) để chứng minh các nhóm chức đặc trưng trong phân tử.", "s": ["Glucose (còn gọi là đường nho) có công thức phân tử C<sub>6<\/sub>H<sub>12<\/sub>O<sub>6<\/sub>, tồn tại nhiều trong quả nho chín và duy trì ở nồng độ ổn định khoảng 0,1% trong máu người bình thường.", "Phản ứng của glucose với Cu(OH)<sub>2<\/sub> ở nhiệt độ phòng tạo dung dịch màu xanh lam thẫm chứng minh phân tử glucose có cấu tạo polyalcohol, còn phản ứng khi đun nóng tạo kết tủa màu đỏ gạch Cu<sub>2<\/sub>O chứng minh glucose có chứa nhóm chức aldehyde (-CHO).", "Đun nóng hoàn toàn 0,1 mol glucose với lượng dư Cu(OH)<sub>2<\/sub> trong môi trường kiềm dư, khối lượng kết tủa màu đỏ gạch Cu<sub>2<\/sub>O thu được tối đa là 14,4 g.", "Trong thí nghiệm điều chế Cu(OH)<sub>2<\/sub> tươi để phản ứng với glucose, nếu lấy dư dung dịch CuSO<sub>4<\/sub> so với dung dịch NaOH (tạo môi trường acid/trung tính), khi đun nóng hỗn hợp với glucose sẽ thu được lượng kết tủa Cu<sub>2<\/sub>O nhiều hơn so với khi dùng dư NaOH."], "a": [true, true, true, false], "img": []}, {"n": 10, "stem": "Amine là hợp chất hữu cơ chứa nitrogen xuất hiện phổ biến trong tự nhiên (như trong cá ươn, lá cây, thực vật) và là nguyên liệu quan trọng trong công nghiệp tổng hợp hóa chất, dược phẩm.", "s": ["Khi thay thế một hay nhiều nguyên tử hydrogen trong phân tử NH<sub>3<\/sub> bằng một hay nhiều gốc hydrocarbon, ta thu được amine; bậc của amine được tính bằng số nguyên tử hydrogen trong phân tử NH<sub>3<\/sub> đã bị thay thế bởi gốc hydrocarbon.", "Hợp chất CH<sub>3<\/sub>-NH-CH<sub>2<\/sub>-CH<sub>3<\/sub> là một amine bậc hai có tên gọi theo danh pháp gốc - chức là ethylmethylamine, còn tên gọi theo danh pháp thay thế là N-methylethanamine.", "Do nguyên tử nitrogen trong nhóm -NH<sub>2<\/sub> của alkylamine còn cặp electron chưa liên kết, dung dịch methylamine trong nước có tính base yếu, làm quỳ tím hóa xanh và phản ứng với dung dịch FeCl<sub>3<\/sub> tạo kết tủa màu nâu đỏ Fe(OH)<sub>3<\/sub>.", "Cho từ từ dung dịch methylamine dư vào ống nghiệm đựng kết tủa Cu(OH)<sub>2<\/sub> tươi; hiện tượng quan sát được là kết tủa Cu(OH)<sub>2<\/sub> màu xanh nhạt tan dần tạo dung dịch màu xanh lam thẫm do methylamine đóng vai trò phối tử tạo phức chất tan với Cu<sup>2+<\/sup>."], "a": [true, true, true, true], "img": []}, {"n": 11, "stem": "", "s": ["Aniline (C<sub>6<\/sub>H<sub>5<\/sub>NH<sub>2<\/sub>) thuộc loại amine thơm bậc một, trong phân tử có nhóm -NH<sub>2<\/sub> liên kết trực tiếp với nguyên tử carbon của vòng benzene.", "Tên gọi theo danh pháp thay thế IUPAC của aniline là benzenamine, còn tên gọi theo danh pháp gốc - chức của nó là phenylamine.", "Mặc dù phân tử aniline có chứa nhóm -NH<sub>2<\/sub>, nhưng do ảnh hưởng hút electron của vòng benzene làm giảm mật độ electron trên nguyên tử nitrogen, nên dung dịch aniline trong nước không làm đổi màu quỳ tím và không làm hồng phenolphthalein.", "Tiến hành thí nghiệm nhỏ từ từ nước bromine vào ống nghiệm chứa dung dịch aniline, hiện tượng quan sát được là nước bromine bị mất màu và xuất hiện kết tủa màu vàng nhạt do phản ứng thế hydrogen ở tất cả các vị trí trên vòng benzene."], "a": [true, true, true, false], "img": []}], "num": [{"n": 3, "stem": "Một nhóm học sinh đã tiến hành thí nghiệm điều chế xà phòng theo các bước sau:<br>Bước 1:Cho khoảng 2 g chất béo và khoảng 4 mL dung dịch NaOH 40% vào bát sứ. Đun hỗn hợp trong khoảng 10 phút và liên tục khuấy bằng đũa thuỷ tinh. Nếu thể tích nước giảm cần bổ sung thêm nước.<br>Bước 2: Kết thúc phản ứng, đổ hỗn hợp vào cốc thuỷ tinh chứa khoảng 30 mL dung dịch NaCl bão hoà, khuấy nhẹ. Để nguội hỗn hợp, tách lấy khối xà phòng nổi lên ở trên.<br><br>Có các phát biểu sau :<br>(1) Phải dùng đũa thủy tinh khuấy đều hỗn hợp trong bát sứ để phản ứng xảy ra nhanh hơn; có cho thêm vài giọt nước để hỗn hợp không cạn đi (thể tích không đổi) thì phản ứng mới thực hiện được<br>(2) Việc thêm NaCl bão hòa để tách xà phòng ra khỏi glycerol do xà phòng tan nhiều trong NaCl bão hòa và nhẹ hơn nên nổi lên trên<br>(3) Sau phản ứng khi chưa thêm NaCl bão hòa thì dung dịch đồng nhất; sau khi thêm NaCl bão hòa thì sản phẩm tách lớp: phần xà phòng rắn ở trên, phần lỏng ở dưới gồm NaCl bão hòa và glycerol<br>(4) Dung dịch thu được sau khi tách bỏ muối của acid báo có thể hòa tan Cu(OH)<sub>2<\/sub> tạo dung dịch màu xanh lam.<br>Liệt kê theo thứ tự tăng dần các phát biểu đúng (ví dụ: 123,...).", "a": "134"}, {"n": 1, "stem": "Cho dãy các chất ở điều kiện thường sau: methyl formate (HCOOCH<sub>3<\/sub>), ethyl acetate (CH<sub>3<\/sub>COOC<sub>2<\/sub>H<sub>5<\/sub>), tristearin ((C<sub>17<\/sub>H<sub>35<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>), triolein ((C<sub>17<\/sub>H<sub>33<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>), tripalmitin ((C<sub>15<\/sub>H<sub>31<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>) và acetic acid(CH<sub>3<\/sub>COOH). Trong dãy trên, có bao nhiêu chất béo ở điều kiện thường tồn tại ở trạng thái rắn?", "a": "2"}, {"n": 2, "stem": "Xà phòng hoá hoàn toàn 4,4 g ethyl acetate bằng dung dịch NaOH dư, thu được bao nhiêu gam muối sodium acetate?", "a": "4,1"}, {"n": 3, "stem": "Thủy phân hoàn toàn 17,6 gam hỗn hợp hai ester đơn chức, mạch hở là đồng phân cấu tạo của nhau có công thức phân tử C<sub>4<\/sub>H<sub>8<\/sub>O<sub>2<\/sub> bằng dung dịch NaOH vừa đủ, thu được dung dịch chứa 19,2 gam hỗn hợp hai muối. Tổng khối lượng của hỗn hợp các alcohol thu được sau phản ứng là bao nhiêu gam?", "a": "6,4"}, {"n": 4, "stem": "Thủy phân hoàn toàn 17,8 gam tristearin ((C<sub>17<\/sub>H<sub>35<\/sub>COO)<sub>3<\/sub>C<sub>3<\/sub>H<sub>5<\/sub>) trong dung dịch NaOH dư, đun nóng. Sau khi phản ứng kết thúc hoàn toàn, thu được m gam glycerol (C<sub>3<\/sub>H<sub>5<\/sub>(OH)<sub>3<\/sub>). Giá trị của m là bao nhiêu gam?", "a": "1,84"}, {"n": 6, "stem": "Thuỷ phân hoàn toàn triglyceride X thu được glycerol và 3 acid béo là lauric acid, palmitic acid và oleic acid. X có thể có bao nhiêu công thức cấu tạo?", "a": "3"}, {"n": 7, "stem": "Tiến hành thí nghiệm nhỏ 1–2 giọt dung dịch iodine vào ống nghiệm chứa 2 mL hồ tinh bột ở nhiệt độ phòng. Sau đó, đun nóng nhẹ ống nghiệm trên ngọn lửa đèn cồn trong khoảng 1–2 phút, rồi để nguội.<br>Cho các phát biểu về thí nghiệm trên:<br>(1) Ở nhiệt độ phòng, dung dịch trong ống nghiệm ngay lập tức xuất hiện màu xanh tím đặc trưng.<br>(2) Khi đun nóng, màu xanh tím nhạt dần rồi mất hẳn do các phân tử iodine bị nhiệt độ cao làm giải phóng khỏi vòng xoắn.<br>(3) Khi để nguội dung dịch, màu xanh tím lại xuất hiện trở lại do các phân tử amylose lại xoắn lại ngậm phân tử iodine.<br>(4) Phản ứng màu này được dùng làm phương pháp đặc trưng để nhận biết hồ tinh bột hoặc dung dịch iodine.<br>(5) Nếu thay hồ tinh bột bằng dung dịch glucose hoặc saccharose thì hiện tượng thí nghiệm xảy ra hoàn toàn tương tự.<br>Hỏi trong các phát biểu trên, có bao nhiêu phát biểu đúng?", "a": "4"}, {"n": 8, "stem": "Trong phòng thí nghiệm, người ta tiến hành đun nóng 32,4 kg cellulose [C<sub>6<\/sub>H<sub>7<\/sub>O<sub>2<\/sub>(OH)<sub>3<\/sub>]n với hỗn hợp dung dịch HNO<sub>3<\/sub> đặc dư và H<sub>2<\/sub>SO<sub>4<\/sub> đặc làm xúc tác. Sau phản ứng thu được m kg cellulose trinitrate [C<sub>6<\/sub>H<sub>7<\/sub>O<sub>2<\/sub>(ONO<sub>2<\/sub>)<sub>3<\/sub>]n. Tính giá trị của m (theo kg), biết hiệu suất toàn bộ quá trình phản ứng nitrat hóa đạt 90%.", "a": "53,46"}, {"n": 9, "stem": "Thủy phân 121,5 kg cưa gỗ chứa 80% cellulose về khối lượng trong môi trường acid với hiệu suất phản ứng thủy phân đạt 75%. Toàn bộ lượng glucose sinh ra được thu lấy và đem lên men rượu thu được V lít ethyl alcohol nguyên chất (C<sub>2<\/sub>H<sub>5<\/sub>OH, khối lượng riêng d = 0,8 g/mL) với hiệu suất của quá trình lên men đạt 80%.<br>Giá trị của V là bao nhiêu lít? (Làm tròn kết quả đến hàng phần mười).", "a": "41,4"}, {"n": 10, "stem": "Glycine (H<sub>2<\/sub>NCH<sub>2<\/sub>COOH) có điểm đẳng điện pHI = 6,0. Tiến hành thí nghiệm điện di dung dịch chứa glycine ở các giá trị pH môi trường khác nhau: pH = 2,0; pH = 6,0; pH = 10,0.Cho các phát biểu sau về thí nghiệm trên:<br>(1) Ở pH = 2,0, glycine tồn tại chủ yếu ở dạng cation  và di chuyển về cực âm (cathode).<br>(2) Ở pH = 6,0, glycine tồn tại chủ yếu ở dạng ion lưỡng cực  và không di chuyển về cực nào.<br>(3) Ở pH = 10,0, glycine tồn tại chủ yếu ở dạng anion và di chuyển về cực dương (anode).<br>(4) Khi tăng pH môi trường từ 2,0 lên 10,0, dạng tồn tại chủ yếu của glycine chuyển đổi theo thứ tự: Cation → Ion lưỡng cực →Anion.  Hỏi trong các phát biểu trên, có bao nhiêu phát biểu ĐÚNG?", "a": "4"}, {"n": 11, "stem": "Một hỗn hợp chứa 3 amino acid gồm: Glycine (pHI = 6,0), Glutamic acid (pHI= 3,2) và Lysine (pHI = 9,7). Tiến hành điện di hỗn hợp này trong dung dịch đệm có pH = 6,0.Cho các nhận định về vị trí của các amino acid sau quá trình điện di:<br>(1) Glycine không bị điện di.<br>(2) Glutamic acid  tồn tại chủ yếu dạng anion mang điện tích âm, di chuyển về cực dương (anode).<br>(3) Lysine  tồn tại chủ yếu dạng cation mang điện tích dương, di chuyển về cực âm (cathode).<br>(4) Phương pháp điện di ở pH = 6,0 có thể phân tách hoàn toàn 3 amino acid trên ra khỏi nhau.<br>(5) Ở pH = 6,0, Lysine di chuyển về cực dương cùng phía với Glutamic acid.Hỏi trong các nhận định trên, có bao nhiêu nhận định ĐÚNG?", "a": "4"}, {"n": 12, "stem": "Cho 5 amino acid thông dụng sau: Glycine (pHI = 6,0), Alanine (pHI = 6,0), Valine (pHI= 6,0), Glutamic acid (pHI = 3,2) và Lysine (pHI= 9,7).Tiến hành điện di hỗn hợp gồm 5 amino acid trên trong dung dịch đệm được duy trì cố định ở pH = 4,0. Hỏi sau khi điện di, có bao nhiêu amino acid di chuyển về cực âm (cathode)?", "a": "4"}]};
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const W={mc:.25,num:.25,tf:1},TFP=[0,.1,.25,.5,1];
const TITLE={en1:"Tiếng Anh – Đề 1",en2:"Tiếng Anh – Đề 2",en3:"Tiếng Anh – 80 câu",h1:"Hóa – Đề thi thử",h2:"Hóa – Ôn toàn bộ"};
const SEC={mc:{t:"Phần I – Trắc nghiệm nhiều phương án lựa chọn"},tf:{t:"Phần II – Trắc nghiệm đúng sai (chọn Đúng hoặc Sai cho từng ý)"},num:{t:"Phần III – Trả lời ngắn (điền đáp án, số thập phân dùng dấu phẩy hoặc chấm)"}};
let Q=[],cur=0,done=false,code=0,mode="",showP=true,showN=innerWidth>720;const app=document.getElementById("app");
const nH=H.mcq.length+H.tf.length+H.num.length;
function home(){app.innerHTML=`<div class="card" style="grid-column:1/-1;text-align:center"><h2 style="margin:4px 0">Ôn tập giữa kì 1 – Lớp 12</h2><p class="mu">Mỗi lần làm, thứ tự câu và đáp án được xáo trộn ngẫu nhiên.</p>
<h3 style="margin:14px 0 4px">📘 Tiếng Anh</h3><button class="b" style="margin:4px" onclick="start('en1')">Đề 1 (40 câu)</button><button class="b" style="margin:4px" onclick="start('en2')">Đề 2 (40 câu)</button><button class="b g" style="margin:4px" onclick="start('en3')">Cả 2 đề (80 câu)</button>
<h3 style="margin:14px 0 4px">🧪 Hóa học</h3><button class="b" style="margin:4px" onclick="start('h1')">Đề thi thử (18 TN + 4 Đúng/Sai + 6 trả lời ngắn)</button><button class="b g" style="margin:4px" onclick="start('h2')">Ôn toàn bộ ngân hàng (${nH} câu)</button></div>`}
function enQ(secs){const r=[];sh(secs).forEach(s=>{let qs=s.q.map(x=>({k:"mc",sec:s,stem:x[0],o:x[3]?x[1].map((t,i)=>({t,c:i==x[2]})):sh(x[1].map((t,i)=>({t,c:i==x[2]}))),pick:null}));if(s.shuf)qs=sh(qs);r.push(...qs)});return r}
function hQ(full){const take=(a,n)=>sh(a).slice(0,full?a.length:n);
const mc=take(H.mcq,18).map(x=>{const o=x.o.map((t,i)=>({t,c:i==x.a}));const ns=o.some(z=>/(cả |tất cả|A và B|B và C)/i.test(z.t));return{k:"mc",sec:SEC.mc,stem:x.stem,img:x.img,o:ns?o:sh(o),pick:null}});
const tf=take(H.tf,4).map(x=>({k:"tf",sec:SEC.tf,stem:x.stem,img:x.img,s:x.s,a:x.a,pick:[null,null,null,null]}));
const nu=take(H.num,6).map(x=>({k:"num",sec:SEC.num,stem:x.stem,img:x.img,a:x.a,val:""}));return[...mc,...tf,...nu]}
function start(m){if(m)mode=m;code=100+Math.floor(Math.random()*900);
Q=mode=="en1"?enQ(S.slice(0,6)):mode=="en2"?enQ(S.slice(6)):mode=="en3"?enQ(S):hQ(mode=="h2");cur=0;done=false;draw();scrollTo(0,0)}
const ok=q=>{const n=s=>s.trim().replace(",",".").replace(/\s/g,"");const a=n(q.a),b=n(q.val);if(!b)return false;if(a===b)return true;const x=parseFloat(a),y=parseFloat(b);return /^[\d.]+$/.test(b)&&!isNaN(y)&&Math.abs(x-y)<1e-6};
const ntf=q=>q.pick.filter((v,i)=>v===q.a[i]).length;
const sc=q=>q.k=="mc"?(q.pick!==null&&q.o[q.pick].c?W.mc:0):q.k=="tf"?TFP[ntf(q)]:(ok(q)?W.num:0);
const st=q=>q.k=="mc"?(q.pick!==null&&q.o[q.pick].c?"r":"w"):q.k=="tf"?(ntf(q)==4?"r":ntf(q)?"p":"w"):(ok(q)?"r":"w");
const dn=q=>q.k=="mc"?q.pick!==null:q.k=="tf"?q.pick.some(v=>v!==null):q.val.trim()!=="";
function side(){const nums=Q.map((x,i)=>{let c="n";if(done)c+=" "+({r:"right",p:"part",w:"wrong"})[st(x)];else if(dn(x))c+=" done";if(i==cur)c+=" cur";return `<button class="${c}" onclick="go(${i})">${i+1}</button>`}).join("");
return `<b>${TITLE[mode]} – Mã ${code}</b><div class="mu">Đã làm ${Q.filter(dn).length}/${Q.length} câu</div><button class="b g s" style="margin:8px 0;padding:6px" onclick="showN=!showN;draw()">${showN?"▲ Ẩn danh sách câu":"▼ Hiện danh sách câu"}</button>${showN?`<div class="grid">${nums}</div>`:""}${done?"":`<button class="b s" onclick="sub()">Nộp bài</button>`}`}
function upd(){document.getElementById("side").innerHTML=side()}
function body(q){const L="ABCD";
if(q.k=="mc")return q.o.map((o,i)=>{let c="o";if(done){if(o.c)c+=" ok";else if(q.pick===i)c+=" no"}else if(q.pick===i)c+=" sel";return `<button class="${c}" onclick="pick(${i})"><b>${L[i]}.</b> ${o.t}</button>`}).join("")+(done&&q.pick===null?'<div class="mu">Bạn chưa chọn đáp án câu này.</div>':"");
if(q.k=="tf")return q.s.map((t,i)=>{const cl=v=>{let c="o";if(done){if(q.a[i]===v)c+=" ok";else if(q.pick[i]===v)c+=" no"}else if(q.pick[i]===v)c+=" sel";return c};return `<div class="tfr"><div>${"abcd"[i]}) ${t}</div><div class="tb"><button class="${cl(true)}" onclick="tfp(${i},true)">Đúng</button><button class="${cl(false)}" onclick="tfp(${i},false)">Sai</button></div></div>`}).join("")+(done?`<div class="mu">Đúng ${ntf(q)}/4 ý.</div>`:"");
return `<input class="inp${done?(ok(q)?" ok":" no"):""}" id="inp" inputmode="decimal" autocomplete="off" placeholder="Nhập đáp án..." value="${q.val.replace(/"/g,"&quot;")}" ${done?"disabled":""} oninput="Q[cur].val=this.value;upd()">${done?`<div style="margin-top:8px">Đáp án đúng: <b>${q.a}</b></div>`:""}`}
function draw(){const q=Q[cur];let score="";
if(done){const e=Q.reduce((a,x)=>a+sc(x),0),m=Q.reduce((a,x)=>a+({mc:W.mc,tf:W.tf,num:W.num})[x.k],0);score=`<div class="card" style="margin-bottom:12px;text-align:center"><div class="mu">Kết quả – ${TITLE[mode]} – Mã ${code}</div><div class="big">${(e*10/m).toFixed(2)} / 10</div><div>Đúng hoàn toàn ${Q.filter(x=>st(x)=="r").length}/${Q.length} câu</div><button class="b" style="margin-top:10px" onclick="start()">Làm lại (mã mới)</button> <button class="b g" style="margin-top:10px" onclick="home()">Chọn đề khác</button></div>`}
app.innerHTML=`<div class="card side" id="side">${side()}</div><div>${score}<div class="card"><div class="ins">${q.sec.t}</div>${q.sec.p?`<button class="b g" style="padding:6px 12px;font-size:14px;margin-bottom:8px" onclick="showP=!showP;draw()">${showP?"▲ Ẩn bài đọc":"▼ Hiện bài đọc"}</button>${showP?`<div class="pass">${q.sec.p}</div>`:""}`:""}<p class="stem">Câu ${cur+1}. ${q.stem}</p>${(q.img||[]).map(s=>`<img class="qi" src="${s}">`).join("")}${body(q)}<div class="nav"><button class="b g" onclick="go(cur-1)" ${cur?"":"disabled"}>← Câu trước</button><button class="b g" onclick="go(cur+1)" ${cur<Q.length-1?"":"disabled"}>Câu sau →</button></div></div></div>`}
function go(i){if(i<0||i>=Q.length)return;cur=i;draw();scrollTo(0,0)}
function pick(i){if(done)return;Q[cur].pick=i;draw()}
function tfp(i,v){if(done)return;Q[cur].pick[i]=Q[cur].pick[i]===v?null:v;draw()}
function sub(){done=true;draw();scrollTo(0,0)}
home();
</script></body></html>
