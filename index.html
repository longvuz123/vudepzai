uyền từ chậu nước sang cốc nước.", "Nhiệt năng truyền từ cốc nước sang chậu nước.", "Không có sự truyền nhiệt năng.", "Cả hai cùng tăng nhiệt độ."], "a": 1}, {"n": "3.27", "stem": "Trong thang nhiệt độ Kelvin, không có giá trị nhiệt độ âm vì", "o": ["0 K là trạng thái động năng nhiệt phân tử bằng 0, không thể nhỏ hơn.", "các nhà khoa học quy ước không dùng số âm.", "áp suất khí không thể âm.", "nhiệt lượng tỏa ra luôn dương."], "a": 0}, {"n": "3.28", "stem": "Nhiệt độ bề mặt Mặt Trời khoảng 5800 K. Trong thang Celsius nhiệt độ này xấp xỉ bằng", "o": ["5527°C.", "6073° C.", "5800°C.", "5000°C."], "a": 0}, {"n": "3.29", "stem": "Mốt số nhiệt kế thủy ngân có chia độ từ -10°C đến 110°C. Độ chia nhỏ nhất thường là 1°C. Phạm vi đo của nhiệt kế này là", "o": ["120°C.", "Từ -10°C đến 110° C.", "Từ 0°C đến 100°C.", "Từ -273°C đến 100°C."], "a": 1}, {"n": "4.1", "stem": "Trong dự án STEM 'Chế tạo nhiệt lượng kế đơn giản', học sinh sử dụng vỏ xốp cách nhiệt bọc ngoài cốc nhôm. Mục đích chính của vỏ xốp là", "o": ["tăng khả năng dẫn nhiệt ra bên ngoài.", "giảm thiểu sự thất thoát nhiệt ra môi trường xung quanh.", "làm tăng nhiệt dung riêng của chất lỏng đo.", "giúp nhiệt lượng kế đẹp hơn."], "a": 1}, {"n": "4.2", "stem": "Nhiệt dung riêng của một chất là nhiệt lượng cần cung cấp để", "o": ["làm 1 kg chất đó tăng thêm 1°C (hoặc 1 K).", "1 kg chất đó nóng chảy hoàn toàn.", "1 kg chất đó hóa hơi hoàn toàn ở nhiệt độ sôi.", "nâng nhiệt độ của toàn bộ vật lên 100°C."], "a": 0}, {"n": "4.3", "stem": "Đơn vị đo của nhiệt dung riêng trong hệ SI là", "o": ["J/kg.", "J/K.", "J/kg·K.", "W/kg·K."], "a": 2}, {"n": "4.4", "stem": "Nhiệt dung riêng của nước là 4180 J/kg·K, của nhôm là 880 J/kg·K. Ý nghĩa của thông số này trong thiết kế nhiệt lượng kế là", "o": ["nước tăng nhiệt độ nhanh hơn nhôm khi nhận cùng nhiệt lượng.", "cốc nhôm mỏng hấp thụ ít nhiệt lượng hơn, nước giữ nhiệt rất tốt.", "nhôm cách nhiệt tốt hơn nước.", "nên dùng cốc bằng nhôm dày làm vỏ cách nhiệt."], "a": 1}, {"n": "4.5", "stem": "Công thức tính nhiệt lượng mà một vật có khối lượng m, nhiệt dung riêng c thu vào để tăng nhiệt độ từ t1 đến t2 là", "o": ["Q = mc(t2 - t1).", "Q = mc / (t2 - t1).", "Q = λm.", "Q = Lm."], "a": 0}, {"n": "5.1", "stem": "Nhiệt nóng chảy riêng λ của một chất rắn là nhiệt lượng cần cung cấp để", "o": ["1 kg chất đó nóng chảy hoàn toàn ở nhiệt độ nóng chảy.", "nâng nhiệt độ của 1 kg chất đó lên 1° C.", "1 kg chất đó hóa hơi ở nhiệt độ sôi.", "chất đó tăng nhiệt độ từ 0°C đến nhiệt độ nóng chảy."], "a": 0}, {"n": "5.2", "stem": "Đơn vị đo của nhiệt nóng chảy riêng trong hệ SI là", "o": ["J/kg.", "J/kg·K.", "J/K.", "W/kg."], "a": 0}, {"n": "5.3", "stem": "Công thức tính nhiệt lượng Q cần cung cấp để làm nóng chảy hoàn toàn khối lượng m chất rắn ở nhiệt độ nóng chảy là", "o": ["Q = λm.", "Q = mcΔt.", "Q = Lm.", "Q = λ / m."], "a": 0}, {"n": "5.4", "stem": "Ý nghĩa nhiệt nóng chảy riêng của nước đá là 3,34 × 10⁵ J/kg là", "o": ["1 kg nước đá ở 0°C cần nhận 3,34 × 10⁵ J nhiệt lượng để tan thành nước ở 0°C.", "1 kg nước đá tỏa ra 3,34 × 10⁵ J khi tăng thêm 1° C.", "1 kg nước cần 3,34 × 10⁵ J để hóa hơi.", "1 kg nước đá cần 3,34 × 10⁵ J để sôi."], "a": 0}, {"n": "5.5", "stem": "Trong quá trình chất rắn tinh thể nóng chảy, năng lượng nhiệt cung cấp cho chất đó dùng để", "o": ["làm tăng động năng trung bình của các phân tử.", "phá vỡ trật tự cấu trúc mạng tinh thể (tăng thế năng phân tử).", "làm giảm thể tích của chất rắn.", "tăng áp suất bề mặt."], "a": 1}, {"n": "5.7", "stem": "Đông đặc là quá trình ngược lại của quá trình nào?", "o": ["Nóng chảy.", "Bay hơi.", "Ngưng tụ.", "Thăng hoa."], "a": 0}, {"n": "5.8", "stem": "Khi 1 kg nước ở 0°C đóng băng hoàn toàn thành nước đá ở 0°C thì nó sẽ", "o": ["tỏa ra nhiệt lượng 3,34 × 10⁵ J.", "thu vào nhiệt lượng 3,34 × 10⁵ J.", "không trao đổi nhiệt lượng.", "tăng nhiệt độ lên."], "a": 0}, {"n": "5.9", "stem": "Chì có nhiệt nóng chảy riêng λ = 0,25 × 10⁵ J/kg. Nhiệt lượng cần để làm nóng chảy hoàn toàn 2 kg chì ở nhiệt độ nóng chảy là", "o": ["0,50 × 10⁵ J.", "0,125 × 10⁵ J.", "1,00 × 10⁵ J.", "2,50 × 10⁵ J."], "a": 0}, {"n": "5.10", "stem": "Tại sao người ta dùng băng (nước đá) để bảo quản thực phẩm tươi sống?", "o": ["Khi tan đá thu nhiệt lượng rất lớn giúp giữ thực phẩm ở 0°C.", "Đá tỏa nhiệt làm lạnh thực phẩm.", "Đá làm thực phẩm khô đi.", "Đá tiêu diệt hoàn toàn vi khuẩn."], "a": 0}, {"n": "5.11", "stem": "Nhiệt độ nóng chảy của chì là 327°C. Khi làm nguội chì lỏng xuống 327°C và tiếp tục cho tỏa nhiệt, nhiệt độ của chì sẽ", "o": ["giữ nguyên 327°C cho đến khi đông đặc hết.", "giảm liên tục xuống 0° C.", "tăng lên.", "biến đổi bất kỳ."], "a": 0}, {"n": "6.1", "stem": "Trong dự án STEM 'Hệ thống làm mát thụ động bằng sự bay hơi nước', không khí đi qua tấm làm mát bị giảm nhiệt độ là do nguyên lý nào?", "o": ["Nước bay hơi thu nhiệt lượng từ không khí xung quanh.", "Nước ngưng tụ tỏa nhiệt làm mát khí.", "Nước truyền lạnh trực tiếp cho gió.", "Quạt gió sinh ra nhiệt độ âm."], "a": 0}, {"n": "6.3", "stem": "Đơn vị đo của nhiệt hóa hơi riêng trong hệ SI là", "o": ["J/kg.", "J/kg·K.", "J/K.", "W/m²."], "a": 0}, {"n": "6.4", "stem": "Nhiệt hóa hơi riêng của nước rất lớn (L = 2,26 × 10⁶ J/kg). Ứng dụng quan trọng của tính chất này trong đời sống là", "o": ["làm chất làm mát hiệu quả trong quạt điều hòa, tháp tản nhiệt và sự điều hòa thân nhiệt qua mồ hôi.", "làm chất cách điện.", "làm nhiên liệu đốt.", "giảm trọng lượng thiết bị."], "a": 0}, {"n": "6.5", "stem": "Công thức tính nhiệt lượng Q cần để làm hóa hơi hoàn toàn khối lượng m chất lỏng ở nhiệt độ sôi là", "o": ["Q = Lm.", "Q = λm.", "Q = mcΔt.", "Q = L / m."], "a": 0}, {"n": "6.6", "stem": "Để tăng hiệu quả làm mát của tấm tản nhiệt trong hệ thống STEM 25, người ta cần", "o": ["tăng diện tích bề mặt tiếp xúc giữa nước và luồng gió di chuyển.", "bịt kín bề mặt tấm tản nhiệt.", "dùng nước ở 100°C.", "giảm tốc độ gió của quạt."], "a": 0}], "tf": [{"n": "2.7", "stem": "Người ta dùng pít-tông nén một khối khí chứa trong xilanh cách nhiệt, làm thể tích khí giảm và nhiệt độ khí tăng.", "s": ["Khối khí nhận công từ pít-tông nên A &gt; 0.", "Do xilanh cách nhiệt nên không có sự truyền nhiệt (Q = 0).", "Độ biến thiên nội năng ΔU = A &gt; 0, làm nội năng của khối khí tăng.", "Nếu thả tự do pít-tông, khối khí dãn nở đẩy pít-tông ra ngoài thì nội năng khối khí tiếp tục tăng."], "a": [true, true, true, false]}, {"n": "2.8", "stem": "Một khối khí lí tưởng thực hiện một chu trình nhận nhiệt lượng 100 J từ nguồn nóng và tỏa nhiệt lượng 40 J cho nguồn lạnh.", "s": ["Nhiệt lượng hệ nhận là Q1 = +100 J.", "Nhiệt lượng hệ tỏa ra là Q2 = -40 J.", "Tổng nhiệt lượng hệ nhận trong cả chu trình là Q = 60 J.", "Công mà khối khí thực hiện trong chu trình bằng 140 J."], "a": [true, true, true, false]}, {"n": "2.9", "stem": "Xét quá trình đun sôi 1 kg nước ở 100°C biến thành hơi nước ở 100°C dưới áp suất 1 atm.", "s": ["Khối nước nhận nhiệt lượng từ bếp đun nên Q &gt; 0.", "Khi biến thành hơi, thể tích tăng mạnh làm hơi nước thực hiện công đẩy khí quyển nên A &lt; 0.", "Nhiệt độ không đổi nên độ biến thiên nội năng ΔU = 0.", "Độ biến thiên nội năng ΔU = Q + A phản ánh sự gia tăng thế năng tương tác phân tử."], "a": [true, true, false, true]}, {"n": "2.10", "stem": "Cho khối khí trong xilanh nhận nhiệt Q = 80 J đồng thời bị nén bởi một công A = 50 J.", "s": ["Khối khí nhận nhiệt nên Q = +80 J.", "Khối khí bị nén nên nhận công A = +50 J.", "Độ biến thiên nội năng ΔU = +130 J.", "Nội năng của khối khí giảm 30 J."], "a": [true, true, true, false]}, {"n": "2.11", "stem": "Cọ xát hai miếng kim loại vào nhau làm chúng nóng lên.", "s": ["Đây là quá trình làm thay đổi nội năng bằng cách thực hiện công.", "Cơ năng đã chuyển hóa hoàn toàn/một phần thành nội năng của hai miếng kim loại.", "Nhiệt độ hai miếng kim loại tăng lên chứng tỏ động năng nhiệt của phân tử tăng.", "Quá trình này là quá trình truyền nhiệt thuần túy."], "a": [true, true, true, false]}, {"n": "4.7", "stem": "Thí nghiệm đo nhiệt dung riêng của nước bằng nhiệt lượng kế đun bằng dây điện trở công suất P.", "s": ["Nhiệt lượng do dây điện trở tỏa ra được tính theo công thức Q = P · Δt.", "Bỏ qua thất thoát nhiệt, nhiệt lượng nước thu vào bằng m c Δt.", "Công thức xác định nhiệt dung riêng là c = (P · Δt) / [m (t2 - t1)].", "Nếu có thất thoát nhiệt ra môi trường, giá trị c tính được từ thí nghiệm sẽ nhỏ hơn giá trị thực tế."], "a": [true, true, true, false]}, {"n": "4.8", "stem": "Thả một quả cầu kim loại khối lượng 0,1 kg ở 100°C vào nhiệt lượng kế chứa 0,2 kg nước ở 20°C. Nhiệt độ cân bằng là 25°C.", "s": ["Quả cầu tỏa nhiệt, nước và nhiệt lượng kế thu nhiệt.", "Phương trình cân bằng nhiệt: Qtỏa = Qthu.", "Độ giảm nhiệt độ của quả cầu là 75°C.", "Độ tăng nhiệt độ của nước là 25°C."], "a": [true, true, true, false]}, {"n": "4.9", "stem": "Xét hai bình chứa cùng một khối lượng chất lỏng: Bình A chứa nước (c = 4200 J/kg·K), Bình B chứa rượu (c = 2500 J/kg·K). Cung cấp cùng nhiệt lượng Q cho hai bình.", "s": ["Rượu trong bình B sẽ tăng nhiệt độ nhanh hơn nước trong bình A.", "Độ tăng nhiệt độ tỉ lệ nghịch với nhiệt dung riêng của chất lỏng.", "Nước có khả năng tích trữ nhiệt lượng cao hơn rượu khi tăng cùng nhiệt độ.", "Nếu để hai bình tự nguội trong cùng môi trường, bình rượu sẽ nguội lâu hơn bình nước."], "a": [true, true, true, false]}, {"n": "4.10", "stem": "Đánh giá thiết kế mô hình Nhiệt lượng kế của học sinh.", "s": ["Sử dụng cốc nhôm mỏng giảm nhiệt dung của bản thân cốc thu nhiệt.", "Nắp cách nhiệt bằng xốp giúp ngăn chặn sự bay hơi và đối lưu nhiệt ra không khí.", "Cắm nhiệt kế chạm sát vào đáy cốc nhôm để đo nhiệt độ chính xác nhất.", "Cần khuấy đều chất lỏng trước khi đọc số chỉ nhiệt độ cân bằng."], "a": [true, true, false, true]}, {"n": "4.11", "stem": "So sánh đất và nước biển trong thực tế khí hậu vùng ven biển.", "s": ["Đất có nhiệt dung riêng nhỏ hơn nước biển rất nhiều.", "Ban ngày dưới ánh nắng, đất nóng lên nhanh hơn nước biển tạo ra gió biển thổi từ biển vào đất liền.", "Ban đêm, đất tỏa nhiệt nguội đi nhanh hơn biển tạo ra gió đất thổi từ đất liền ra biển.", "Nước biển có nhiệt dung riêng nhỏ nên nhiệt độ nước biển biến đổi rất mạnh giữa ngày và đêm."], "a": [true, true, true, false]}, {"n": "5.13", "stem": "Thí nghiệm dùng lò đun công suất P = 200 W để làm nóng chảy 0,5 kg chì ở nhiệt độ nóng chảy 327°C. Thời gian nóng chảy đo được là 62,5 giây. Bỏ qua thất thoát nhiệt.", "s": ["Nhiệt lượng lò cung cấp trong thời gian nóng chảy là Q = P · t = 12.500 J.", "Nhiệt nóng chảy riêng của chì xác định từ thí nghiệm là λ = 2,5 × 10⁴ J/kg.", "Trong thời gian 62,5 giây này, nhiệt độ của khối chì tăng thêm 100°C.", "Nếu công suất lò giảm đi một nửa thì thời gian làm nóng chảy sẽ tăng gấp đôi."], "a": [true, true, false, true]}, {"n": "5.14", "stem": "Thả 0,1 kg nước đá ở 0°C vào 0,4 kg nước ở 20°C. Cho λđá = 3,34 × 10⁵ J/kg, cnước = 4200 J/kg·K.", "s": ["Nhiệt lượng tối đa nước tỏa ra khi hạ xuống 0°C là 33.600 J.", "Nhiệt lượng cần để 0,1 kg nước đá tan hết ở 0°C là 33.400 J.", "Nước đá không thể tan hết vì nước tỏa không đủ nhiệt.", "Sau khi cân bằng nhiệt, toàn bộ nước đá đã tan hết và nhiệt độ cân bằng cao hơn 0°C."], "a": [true, true, false, true]}, {"n": "5.15", "stem": "Xét quá trình đun chảy một cục nước đá -10°C thành nước 0°C.", "s": ["Giai đoạn 1: Nước đá nhận nhiệt tăng từ -10°C lên 0°C (Q1 = m cđá Δt).", "Giai đoạn 2: Nước đá nhận nhiệt nóng chảy ở 0°C (Q2 = λm).", "Tổng nhiệt lượng cần cung cấp là Q = Q1 + Q2.", "Nhiệt dung riêng của nước đá bằng nhiệt dung riêng của nước lỏng."], "a": [true, true, true, false]}, {"n": "5.16", "stem": "Sử dụng tuyết/băng đóng trên núi cao để điều hòa khí hậu khu vực.", "s": ["Khi mùa xuân đến, băng tuyết tan hấp thụ lượng nhiệt khổng lồ từ không khí.", "Hiện tượng này giúp vùng xung quanh không bị tăng nhiệt độ quá đột ngột.", "Quá trình tuyết tan là quá trình tỏa nhiệt ra môi trường.", "Nhiệt nóng chảy riêng lớn của nước đá có vai trò quan trọng trong cân bằng sinh thái Trái Đất."], "a": [true, true, false, true]}, {"n": "5.17", "stem": "Đo nhiệt nóng chảy riêng của nước đá bằng nhiệt lượng kế.", "s": ["Cần lau khô cục nước đá trước khi thả vào nhiệt lượng kế để tránh làm tăng khối lượng nước lỏng.", "Cân khối lượng nước đá mđá bằng cân kỹ thuật.", "Độ giảm nhiệt độ của nước trong nhiệt lượng kế cho biết nhiệt lượng tỏa ra.", "Nếu không lau khô nước đá, giá trị λ tính được sẽ lớn hơn giá trị thực tế."], "a": [true, true, true, false]}, {"n": "6.7", "stem": "Thí nghiệm đo nhiệt hóa hơi riêng của nước bằng đĩa nhiệt công suất P = 600 W. Sau khi nước sôi, trong thời gian Δt = 300 s, khối lượng nước giảm Δm = 0,075 kg.", "s": ["Nhiệt lượng đĩa nhiệt tỏa ra là Q = P · Δt = 180.000 J.", "Giá trị nhiệt hóa hơi riêng tính được là L = 180.000 / 0,075 = 2,4 × 10⁶ J/kg.", "Trong suốt thời gian 300 s nước sôi, nhiệt độ của nước tiếp tục tăng lên 110°C.", "Nếu có thất thoát nhiệt ra môi trường không khí xung quanh, giá trị L tính toán sẽ lớn hơn giá trị thực tế."], "a": [true, true, false, true]}, {"n": "6.8", "stem": "Đánh giá mô hình Quạt làm mát hơi nước thiết kế bởi học sinh.", "s": ["Mô hình hoạt động dựa trên sự thu nhiệt khi hóa hơi/bay hơi của nước.", "Khi độ ẩm không khí môi trường càng cao (trời mưa ẩm), hiệu quả làm mát của quạt càng giảm.", "Tấm làm mát bằng xốp lỗ xốp hoặc giấy tổ ong giúp tăng diện tích tiếp xúc và giữ nước đều.", "Hệ thống làm mát này làm giảm độ ẩm tuyệt đối trong phòng xuống 0%."], "a": [true, true, true, false]}, {"n": "6.9", "stem": "So sánh sự bay hơi và sự sôi của chất lỏng.", "s": ["Sự bay hơi diễn ra ở bất kỳ nhiệt độ nào, sự sôi chỉ diễn ra ở nhiệt độ sôi xác định.", "Sự bay hơi chỉ xảy ra trên mặt thoáng, sự sôi xảy ra ở cả mặt thoáng và trong lòng chất lỏng.", "Cả sự bay hơi và sự sôi đều cần hấp thụ nhiệt lượng từ môi trường/nguồn nhiệt.", "Trong quá trình bay hơi ở nhiệt độ phòng, nhiệt độ chất lỏng còn lại sẽ tăng lên."], "a": [true, true, true, false]}, {"n": "6.10", "stem": "Đun một ấm chứa 1,0 kg nước ở 20°C đến khi sôi ở 100°C và hóa hơi hoàn toàn.", "s": ["Giai đoạn 1: Nước tăng từ 20°C đến 100°C thu Q1 = m c Δt = 336 kJ.", "Giai đoạn 2: Nước hóa hơi hoàn toàn ở 100°C thu Q2 = L m = 2260 kJ.", "Nhiệt lượng để hóa hơi hoàn toàn (Q2) lớn hơn rất nhiều nhiệt lượng để đun sôi (Q1).", "Tổng nhiệt lượng cần cung cấp là Q = Q1 + Q2 = 2596 kJ."], "a": [true, true, true, true]}, {"n": "6.11", "stem": "Ứng dụng nhiệt hóa hơi riêng lớn của nước trong sinh học.", "s": ["Khi cơ thể vận động nóng lên, tuyến mồ hôi tiết ra nước trên bề mặt da.", "Sự bay hơi của mồ hôi thu nhiệt lượng từ cơ thể, giúp hạ nhiệt và duy trì 37°C.", "Trong môi trường độ ẩm 100%, mồ hôi khó bay hơi khiến người ta thấy vô cùng oi bực.", "Quạt máy thổi vào người làm mát là do quạt hạ trực tiếp nhiệt độ không khí."], "a": [true, true, true, false]}], "num": [{"n": "2.13", "stem": "Truyền cho khối khí trong xilanh nhiệt lượng 120 J. Khối khí dãn nở thực hiện công 80 J đẩy pít-tông. Độ biến thiên nội năng của khối khí là bao nhiêu Joule (J)?", "a": "40"}, {"n": "2.14", "stem": "Khi nén một khối khí, công thực hiện lên khối khí là 150 J. Do xilanh không cách nhiệt hoàn toàn nên khối khí tỏa ra môi trường nhiệt lượng 40 J. Độ biến thiên nội năng của khối khí bằng bao nhiêu Joule (J)?", "a": "110"}, {"n": "2.15", "stem": "Một quả bóng cao su rơi từ độ cao 2,0 m xuống sàn nảy lên độ cao 1,5 m. Biết khối lượng quả bóng là 0,2 kg, g = 9,8 m/s². Độ biến thiên nội năng của quả bóng và mặt sàn do va chạm là bao nhiêu Joule (J)?", "a": "0,98"}, {"n": "2.16", "stem": "Truyền nhiệt lượng 250 J cho một khối khí lí tưởng thì nội năng của nó tăng thêm 180 J. Công mà khối khí thực hiện ra bên ngoài có độ lớn là bao nhiêu Joule (J)?", "a": "70"}, {"n": "2.17", "stem": "Thực hiện công 200 J để nén khí trong xilanh làm nội năng khối khí tăng thêm 140 J. Nhiệt lượng mà khối khí trao đổi với môi trường là bao nhiêu Joule (J)? (Nếu tỏa nhiệt ghi dấu âm).", "a": "-60"}, {"n": "3.31", "stem": "Nhiệt độ phòng hiện tại là 25°C. Hãy tính nhiệt độ này theo thang nhiệt độ Kelvin (K) (làm tròn đến hàng đơn vị).", "a": "298"}, {"n": "3.32", "stem": "Nhiệt độ sôi của nitơ lỏng là 77 K. Tính nhiệt độ sôi này theo thang nhiệt độ Celsius (°C). (làm tròn đến hàng đơn vị).", "a": "-196"}, {"n": "3.33", "stem": "Một mẫu vật liệu được đun nóng làm nhiệt độ tăng thêm Δt = 45°C. Độ biến thiên nhiệt độ của mẫu vật liệu này theo thang Kelvin là bao nhiêu Kelvin (K)? (làm tròn đến hàng đơn vị).", "a": "45"}, {"n": "3.34", "stem": "Nhiệt độ cơ thể của một bệnh nhân được đo là 102,2°F. Biết công thức t(°C) = (tF - 32) / 1,8. Nhiệt độ bệnh nhân theo °C là bao nhiêu? (làm tròn đến hàng đơn vị).", "a": "39"}, {"n": "4.13", "stem": "Thả 0,4 kg hợp kim ở 100°C vào nhiệt lượng kế chứa 0,8 kg nước ở 20°C. Nhiệt độ cân bằng là 24°C. Cho cnước = 4180 J/kg·K. Bỏ qua nhiệt lượng kế. Nhiệt dung riêng của hợp kim là bao nhiêu J/kg·K?", "a": "440"}, {"n": "4.14", "stem": "Tính nhiệt lượng cần thiết (theo đơn vị kJ) để đun nóng 2,0 kg nước từ 25°C đến 100°C. Cho cnước = 4200 J/kg·K.", "a": "630"}, {"n": "4.15", "stem": "Một ấm điện công suất 1500 W đun 1,5 kg nước từ 20°C đến 100°C. Biết hiệu suất của ấm là 84%, c = 4200 J/kg·K. Thời gian đun nước là bao nhiêu giây (s)?", "a": "400"}, {"n": "4.16", "stem": "Trong thí nghiệm STEM đo c của viên sắt (m1 = 0,2 kg), học sinh đun sôi viên sắt ở 100°C rồi thả vào 0,3 kg nước ở 20°C. Nhiệt độ cân bằng đo được là 25°C. Tính c của sắt thu được từ thực nghiệm (J/kg·K). Cho cnước = 4200 J/kg·K.", "a": "420"}, {"n": "4.17", "stem": "Trộn 1,0 kg nước ở 80°C với 2,0 kg nước ở 20°C. Bỏ qua thất thoát nhiệt. Nhiệt độ cân bằng của hỗn hợp là bao nhiêu °C?", "a": "40"}, {"n": "5.19", "stem": "Tính nhiệt lượng (theo đơn vị kJ) cần cung cấp để làm nóng chảy hoàn toàn 2,0 kg nước đá ở 0°C. Cho nhiệt nóng chảy riêng của nước đá λ = 3,34 × 10⁵ J/kg.", "a": "668"}, {"n": "5.20", "stem": "Một ấm đun chì công suất 500 W chứa 1,0 kg chì ở nhiệt độ nóng chảy 327°C. Biết nhiệt nóng chảy riêng của chì là λ = 2,5 × 10⁴ J/kg. Bỏ qua thất thoát nhiệt. Thời gian để làm chì nóng chảy hoàn toàn là bao nhiêu giây (s)?", "a": "50"}, {"n": "5.21", "stem": "Thả 0,2 kg nước đá ở 0°C vào bình chứa 1,0 kg nước ở 30°C. Cho λ = 3,34 × 10⁵ J/kg, c = 4200 J/kg·K. Nhiệt độ cân bằng của hệ là bao nhiêu °C? (Làm tròn đến hàng phần mười).", "a": "11,7"}, {"n": "5.22", "stem": "Dùng bếp điện để làm nóng chảy 0,5 kg một chất rắn ở nhiệt độ nóng chảy. Bếp cung cấp nhiệt lượng ổn định 2000 J mỗi giây. Sau 100 giây chất rắn tan hết. Nhiệt nóng chảy riêng của chất đó là bao nhiêu kJ/kg?", "a": "400"}, {"n": "5.23", "stem": "Cần cung cấp nhiệt lượng bao nhiêu kiloJoule (kJ) để đun 1,0 kg nước đá từ -10°C nóng chảy hoàn toàn thành nước ở 0°C? Cho cđá = 2100 J/kg·K, λ = 3,34 × 10⁵ J/kg.", "a": "355"}, {"n": "6.13", "stem": "Một ấm đun nước công suất 1500 W chứa 1,2 kg nước ở 100°C. Cho L = 2,26 × 10⁶ J/kg. Bỏ qua thất thoát nhiệt. Thời gian cần thiết để hóa hơi hoàn toàn 0,3 kg nước ở 100°C là bao nhiêu giây (s)?", "a": "452"}, {"n": "6.14", "stem": "Trong mô hình quạt điều hòa STEM, mỗi giờ hệ thống làm bay hơi 1,5 kg nước ở 25°C. Cho nhiệt hóa hơi của nước ở 25°C là 2,4 × 10⁶ J/kg. Công suất thu nhiệt trung bình của dòng không khí đi qua tấm tản nhiệt là bao nhiêu Watt (W)?", "a": "1000"}, {"n": "6.15", "stem": "Tính nhiệt lượng tổng cộng (theo đơn vị kJ) cần cung cấp để đun 0,5 kg nước từ 20°C đến khi hóa hơi hoàn toàn ở 100°C. Cho c = 4200 J/kg·K, L = 2,26 × 10⁶ J/kg.", "a": "1298"}, {"n": "6.16", "stem": "Một đĩa nhiệt công suất 800 W đun một nồi nước sôi. Sau 5 phút, khối lượng nước trong nồi giảm đi bao nhiêu gram (g)? Giả sử 100% nhiệt lượng dùng để hóa hơi nước. Cho L = 2,26 × 10⁶ J/kg. (Làm tròn đến hàng đơn vị).", "a": "106"}, {"n": "6.18", "stem": "Bếp đun có hiệu suất 75%, đun 2,0 kg nước ở 100°C hóa hơi 50%. Bếp tỏa ra tổng nhiệt lượng là bao nhiêu kiloJoule (kJ)? Cho L = 2,26 × 10⁶ J/kg. (làm tròn đến hàng đơn vị).", "a": "3013"}]};
const SI={"mcq": [{"n": "mc-1-7", "stem": "Khi nghiên cứu DNA của 4 chủng vi khuẩn thu được bảng sau (số lượng nucleotide A / T / G / C): chủng I: 700 / 700 / 700 / 700; chủng II: 800 / 800 / 700 / 700; chủng III: 450 / 450 / 1050 / 1050; chủng IV: 600 / 600 / 900 / 900. Hãy cho biết phát biểu nào sau đây đúng?", "o": ["Tổng số nucleotide của chủng I nhiều hơn chủng II.", "Chủng I và chủng IV có chiều dài phân tử bằng nhau.", "Phân tử DNA của Chủng II có số liên kết hidrogene nhiều hơn phân tử DNA của chủng IV.", "Phân tử DNA của chủng III có nhiệt độ nóng chảy cao nhất."], "a": 3}, {"n": "mc-1", "stem": "Bốn loại đơn phân cấu tạo DNA có kí hiệu là:", "o": ["A, U, G, C.", "A, T, G, C.", "A, U, G, T.", "U, T, G, A."], "a": 1}, {"n": "mc-2", "stem": "Các đơn phân cấu tạo nên phân tử DNA khác nhau ở thành phần nào sau đây?", "o": ["Nitrogenous base.", "Gốc phosphate.", "Đường deoxyribose.", "Đường ribose."], "a": 0}, {"n": "mc-3", "stem": "Quá trình tái bản DNA diễn ra chủ yếu ở vị trí nào trong tế bào sinh vật nhân thực?", "o": ["Tế bào chất.", "Ribosome.", "Màng sinh chất.", "Nhân tế bào."], "a": 3}, {"n": "mc-4", "stem": "Trong quá trình nhân đôi DNA, enzyme DNA polymerase có chức năng nào sau đây?", "o": ["Tháo xoắn phân tử DNA mẹ.", "Lắp ráp các nucleotide tự do", "Tổng hợp đoạn mồi RNA.", "Nối các đoạn Okazaki lại với nhau."], "a": 1}, {"n": "mc-5", "stem": "Ở cơ chế tái bản DNA, sự kết hợp đặc hiệu A - T và G - C trên hai mạch đơn thể hiện nguyên tắc nào sau đây?", "o": ["Nguyên tắc bán bảo toàn.", "Nguyên tắc đa phân.", "Nguyên tắc bổ sung.", "Nguyên tắc bảo toàn."], "a": 2}, {"n": "mc-6", "stem": "Cho đoạn mạch DNA gốc có trình tự như sau: 5' ATGCTTAG 3'. Khi tái bản DNA, mạch mới bổ sung cho đoạn mạch DNA gốc này sẽ có trình tự là", "o": ["5' GATTCGTA3'.", "3' TACGAATC5'.", "5' TACGAATC3'.", "3' UACGAAUC5'."], "a": 1}, {"n": "mc-1", "stem": "Một đoạn của phân tử DNA mang thông tin quy định chuỗi polipeptide hoặc phân tử RNA được gọi là", "o": ["gene.", "amino acid.", "protein.", "nucleotide."], "a": 0}, {"n": "mc-2", "stem": "Quá trình tổng hợp RNA dựa trên mạch khuôn của gene được gọi là", "o": ["phiên mã.", "dịch mã.", "nhân đôi DNA.", "đột biến."], "a": 0}, {"n": "mc-4", "stem": "Bộ ba đối mã có trên phân tử nào sau đây?", "o": ["mRNA.", "DNA", "tRNA.", "rRNA"], "a": 2}, {"n": "mc-5", "stem": "Dịch mã là quá trình tổng hợp nên phân tử nào sau đây?", "o": ["DNA.", "RNA.", "Protein.", "tRNA."], "a": 2}, {"n": "mc-1", "stem": "Nội dung chính của sự điều hòa biêu hiện gen là", "o": ["kiểm soát quá trình dịch mã.", "kiểm soát quá trình tạo sản phẩm của gene.", "kiểm soát quá trình phiên mã.", "điều hoà hoạt động nhân đôi ADN."], "a": 1}, {"n": "mc-2", "stem": "Thí nghiệm của Monod và Jacob trên operon Lac ở vi khuẩn E. coli đã chứng minh allolactose có vai trò gì?", "o": ["Gắn và làm mất hoạt tính của protein điều hoà.", "Gắn với promoter đề hoạt hoá phiên mã.", "Gắn với các gene cấu trúc để hoạt hoá phiên mã.", "Gắn với operator để hoạt hoá phiên mã."], "a": 0}, {"n": "mc-4", "stem": "Ở sinh vật nhân sơ, sự điều hòa biểu hiện gene chủ yếu diễn ra ở mức độ nào?", "o": ["Điều hòa phiên mã.", "Điều hòa dịch mã.", "Điều hòa sau dịch mã.", "Điều hòa nhân đôi DNA."], "a": 0}, {"n": "mc-5", "stem": "Theo Jacob và Monod, các thành phần cấu tạo của operon Lac gồm", "o": ["gene lacI, nhóm gene cấu trúc, vùng điều hoà (P).", "vùng điều hoà (P), vùng vận hành (O), nhóm gene cấu trúc.", "gene lacI, nhóm gene cấu trúc, vùng vận hành (O).", "gene lacI, nhóm gene cấu trúc, vùng vận hành (O), vùng điều hoà (P)"], "a": 1}, {"n": "mc-1", "stem": "Đột biến điểm là những biến đổi cấu trúc gene liên quan đến", "o": ["một số cặp nucleotide.", "một đoạn nhiễm sắc thể.", "toàn bộ phân tử DNA.", "một cặp nucleotide."], "a": 3}, {"n": "mc-2", "stem": "Thể đột biến là", "o": ["cơ thể mang đột biến gene ở trạng thái lặn chưa biểu hiện ra kiểu hình.", "cơ thể mang đột biến đã biểu hiện ra kiểu hình.", "cá thể mang mọi loại đột biến có trong quần thể.", "tế bào mang gene bị biến đổi cấu trúc."], "a": 1}, {"n": "mc-3", "stem": "Loại đột biến gene nào sau đây thường gây hậu quả nghiêm trọng nhất đối với cấu trúc của chuỗi polypeptide?", "o": ["Thay thế 1 cặp nucleotide ở vị trí bộ ba cuối cùng.", "Thay thế 1 cặp nucleotide ở vùng intron.", "Thêm hoặc mất 1 cặp nucleotide ở đầu vùng mã hóa.", "Thay thế 1 cặp nucleotide làm thay đổi 1 amino acid."], "a": 2}, {"n": "mc-4", "stem": "Trong tiến hóa, đột biến gene có vai trò", "o": ["cung cấp nguồn nguyên liệu thứ cấp cho chọn lọc tự nhiên.", "cung cấp nguồn nguyên liệu sơ cấp cho quá trình tiến hóa.", "luôn tạo ra các kiểu hình có lợi cho sinh vật.", "làm giảm sự đa dạng di truyền của quần thể."], "a": 1}, {"n": "mc-5", "stem": "Tác nhân 5-bromouracil (5-BrU) gây ra loại đột biến gene nào sau đây?", "o": ["Thêm 1 cặp A - T.", "Mất 1 cặp G - C.", "Thay thế cặp A - T bằng cặp G - C.", "Thay thế cặp G - C bằng cặp A - T."], "a": 2}, {"n": "mc-1", "stem": "Sinh vật biến đổi gene là sinh vật có", "o": ["ngoại hình thay đổi do thường biến.", "hệ gene đã được biến đổi, thường là mang thêm gene của loài khác.", "số lượng nhiễm sắc thể thay đổi so với bình thường.", "khả năng sinh sản vô tính mạnh mẽ."], "a": 1}, {"n": "mc-2", "stem": "DNA tái tổ hợp (recombinant DNA) được tạo ra từ", "o": ["việc cắt và nối hai phân tử RNA của cùng một loài.", "việc nhân đôi phân tử DNA của tế bào chất.", "sự kết hợp đoạn DNA mang gene cần chuyển và phân tử DNA làm thể truyền (vector).", "sự lai giống tự nhiên giữa hai loài sinh vật."], "a": 2}, {"n": "mc-3", "stem": "Một trong những thành tựu nổi bật của công nghệ gene là", "o": ["tạo ra giống cừu Dolly bằng phương pháp nhân bản vô tính.", "tạo ra giống lợn siêu nạc bằng lai giống truyền thống.", "tạo ra vi khuẩn E. coli sản xuất insulin của người.", "tạo ra giống lúa mì lục bội có năng suất cao."], "a": 2}, {"n": "mc-4", "stem": "Công nghệ gene đang được sử dụng phổ biến hiện nay là", "o": ["kĩ thuật tạo tế bào lai.", "công nghệ DNA tái tổ hợp.", "kĩ thuật cắt gene.", "kĩ thuật nối gene."], "a": 1}, {"n": "mc-5", "stem": "Thành tựu nào sau đây là ứng dụng của công nghệ tạo thực vật biến đổi gene?", "o": ["Cừu mang gene tổng hợp protein antithrombin.", "Giống lúa vàng (Golden rice) tổng hợp tiền chất vitamin A.", "Vi khuẩn E. coli sản xuất insulin.", "Cá hồi mang thêm gene hormone sinh trưởng."], "a": 1}, {"n": "mc-7", "stem": "Trong công nghệ gene, việc sử dụng enzyme cắt giới hạn (restrictase) nhằm mục đích gì?", "o": ["Cắt phân tử DNA tại các vị trí xác định để tạo ra các đầu dính.", "Nối các đoạn DNA lại với nhau.", "Phân hủy các gene không cần thiết.", "Tháo xoắn phân tử DNA."], "a": 0}, {"n": "mc-8", "stem": "Trong quy trình tạo DNA tái tổ hợp, enzyme ligase có vai trò gì?", "o": ["Cắt phân tử DNA tại các vị trí đặc hiệu.", "Nối các đoạn DNA lại với nhau nhờ tạo liên kết phosphodiester.", "Tháo xoắn và tách hai mạch của DNA.", "Chuyển DNA tái tổ hợp vào tế bào nhận."], "a": 1}, {"n": "mc-9", "stem": "Tại sao vi khuẩn thường được chọn làm tế bào nhận trong công nghệ gene?", "o": ["Vì vi khuẩn có hệ gene rất lớn và phức tạp.", "Vì vi khuẩn có cấu tạo đa bào, dễ quan sát.", "Vì vi khuẩn sinh sản rất nhanh, giúp nhân bản gene chuyển và tổng hợp lượng lớn sản phẩm.", "Vì vi khuẩn không bị đột biến."], "a": 2}, {"n": "mc-10", "stem": "Một trong những quan ngại lớn về an toàn sinh thái khi sử dụng cây trồng biến đổi gene mang gene kháng thuốc diệt cỏ là gì?", "o": ["Cây trồng sẽ sinh trưởng chậm hơn cây bình thường.", "Gene kháng thuốc diệt cỏ có thể phát tán sang cỏ dại hoang dại tạo ra \"siêu cỏ dại\".", "Cây trồng không thể quang hợp được nữa.", "Làm tăng lượng CO2 trong bầu khí quyển."], "a": 1}, {"n": "mc-1", "stem": "Hóa chất nào sau đây được sử dụng để phá vỡ màng tế bào và màng nhân trong thực hành tách chiết DNA?", "o": ["Cồn ethanol lạnh.", "Nước rửa chén bát.", "Nước dứa tươi.", "Dung dịch muối sinh lý."], "a": 1}, {"n": "mc-2", "stem": "Trong thực hành tách chiết DNA, người ta thường bổ sung d : ["Operon Lac bao gồm vùng khởi động (P), vùng vận hành (O) và cụm gene cấu trúc Z, Y, A.", "Khi môi trường không có lactose, protein ức chế liên kết với vùng vận hành (O) làm cản trở RNA polymerase.", "Khi môi trường có lactose, lactose sẽ liên kết với enzyme RNA polymerase để kích hoạt phiên mã.", "Nếu một đột biến làm hỏng vùng (O) của operon Lac, cụm gene cấu trúc Z, Y, A sẽ liên tục được phiên mã ngay cả khi không có lactose."], "a": [true, true, false, true]}, {"n": "tf-2", "stem": "Phân tích vai trò và ý nghĩa của điều hòa biểu hiện gene, có các nhận định sau:", "s": ["Điều hòa biểu hiện gene giúp tế bào tổng hợp protein với lượng phù hợp với nhu cầu.", "Mọi gene trong hệ gene của tế bào đều được biểu hiện đồng thời ở mọi thời điểm.", "Ở sinh vật đa bào, sự điều hòa biểu hiện gene giúp các tế bào biệt hóa thành các mô, cơ quan thực hiện chức năng khác nhau dù có cùng hệ gene.", "Sự kháng thuốc kháng sinh ở vi khuẩn là hệ quả của việc biểu hiện các gene kháng thuốc khi có mặt chất cảm ứng là kháng sinh trong môi trường."], "a": [true, false, true, true]}, {"n": "tf-4", "stem": "Xem xét quá trình điều hòa hoạt động của operon Lac:", "s": ["Sản phẩm của cụm gene cấu trúc Z, Y, A là các enzyme phân giải đường lactose.", "Các gene Z, Y, A có chung một vùng điều hòa (P và O) và được phiên mã tạo ra một phân tử mRNA chung.", "Quá trình dịch mã mRNA của operon Lac sẽ tạo ra một chuỗi polypeptide duy nhất, sau đó bị cắt thành 3 enzyme tương ứng.", "Nếu một chủng vi khuẩn bị đột biến điểm ở gene Z, thì gene Y và gene A vẫn có thể được phiên mã thành mRNA bình thường."], "a": [true, true, false, true]}, {"n": "tf-1", "stem": "Xét về nguyên nhân và cơ chế phát sinh đột biến gene, có các nhận định sau:", "s": ["Đột biến gene phát sinh chủ yếu do tác động của các tác nhân gây đột biến.", "Đột biến thêm hoặc mất 1 cặp nucleotide sẽ làm dịch khung đọc mã di truyền kể từ vị trí xảy ra đột biến.", "Bệnh thiếu máu hồng cầu hình liềm ở người là hậu quả của đột biến thay thế 1 cặp nucleotide, làm biến đổi 1 amino acid trong chuỗi hemoglobin.", "Việc tránh tiếp xúc với tia UV là một biện pháp hạn chế sự phát sinh đột biến gene gây ung thư da ở người."], "a": [false, true, true, true]}, {"n": "tf-2", "stem": "Khi nói về tính chất và hậu quả của đột biến gene có các nhận định sau:", "s": ["Đột biến thay thế cặp nucleotide luôn làm thay đổi trình tự amino acid của chuỗi polypeptide.", "Giá trị thích nghi của đột biến gene (có lợi, có hại hay trung tính) có thể thay đổi tùy thuộc vào tổ hợp gene và môi trường sống.", "Một đột biến mất 3 cặp nucleotide liên tiếp nằm trọn vẹn trong 1 bộ ba sẽ làm dịch khung đọc của toàn bộ gene.", "Để tạo ra giống cây trồng mang đột biến có lợi, con người có thể chủ động sử dụng tác nhân hóa học để gây đột biến nhân tạo rồi chọn lọc."], "a": [false, true, false, true]}, {"n": "tf-4", "stem": "Khi nghiên cứu về cơ chế tác động của hóa chất gây đột biến có các nhận định sau:", "s": ["5-BrU là đồng đẳng của Thymine nên có thể bắt cặp nhầm với Guanine trong quá trình tái bản DNA.", "Hóa chất acridine orange thường gây ra đột biến thay thế cặp nucleotide.", "Quá trình thay thế A-T thành G-C do 5-BrU cần trải qua 3 lần nhân đôi DNA kể từ khi 5-BrU xen vào mạch.", "Nếu một công nhân làm việc trong môi trường nhiễm dioxin sinh con bị dị tật do đột biến gene, đột biến này chắc chắn xảy ra ở tế bào sinh dưỡng (soma) của người bố."], "a": [true, false, true, false]}, {"n": "tf-2", "stem": "Đánh giá về cơ sở tế bào học của các quy luật Mendel:", "s": ["Các nhân tố di truyền của Mendel chính là các gene trên nhiễm sắc thể theo quan điểm hiện đại.", "Sự phân li của các nhiễm sắc thể tương đồng trong giảm phân I là cơ sở cho sự phân li của cặp allele.", "Điều kiện để hai gene phân li độc lập là chúng phải nằm trên cùng một nhiễm sắc thể.", "Quá trình thụ tinh khôi phục trạng thái lưỡng bội (2n) bằng sự kết hợp ngẫu nhiên của các giao tử."], "a": [true, true, false, true]}, {"n": "tf-3", "stem": "Sơ đồ mô tả thí nghiệm của Mendel: Mỗi nhận định sau đây là Đúng hay Sai về thí nghiệm này?", "s": ["Đây là phép lai 2 cặp tính trạng: tính trạng màu sắc hạt và hình dạng hạt.", "X3, X4 có một loại cây, 1 loại kiểu gene và 1 loại kiểu hình", "X6 có một loại cây, 2 loại kiểu gene và 1 loại kiểu hình.", "Nếu F2 có 2000 cây, thì số lượng cây ứng từng kiểu hình: X5: X6 : X7 : X8 = 900 : 600 : 600 : 100."], "a": [true, true, true, false], "img": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABCkAAAKwCAIAAAA6LbKBAAAAAXNSR0IArs4c6QAA/8pJREFUeF7snQVYVNsWgM90D93dKWAAAiKC3Yrd3d3d3d3d3a2oICHSgnR393S+PQwXAQcY8N771Lv3d7/3gFm7/nOcc9ZehRKJRAhskAAkAAlAApAAJAAJQAKQACQACfzDBND/8PhweEgAEoAEIAFIABKABCABSAASgAQkBKDuAe8DSAASgAQgAUgAEoAEIAFIABL4NwhA3ePfoAzngAQgAUgAEoAEIAFIABKABCABqHvAewASgAQgAUgAEoAEIAFIABKABP4NAlD3+DcowzkgAUgAEoAEIAFIABKABCABSADqHvAegAQgAUgAEoAEIAFIABKABCCBf4MACubY/TcwwzkgAUgAEvjjCAQG+ty4fvmP2xbcECTw/yegpaW9YePe//864AoggX+AANQ9Wgd148Yl2dnZresDpSEBSKCVBDZs2G5sbNnKTlD83ybw4cOL8+dOde/RE4/H/9tzw/kggT+XQEz0VwSF2rv31J+7Rbiz/zQBqHu07vKvXj0PdOjQoVPrukFpSAASkI9AcXFRYID/1m17TU2t5esBpf5vBKS6x6nTVxUUlP9vi4ATQwJ/HIGTJ/dmZKRD3eOPu7BwQ7UEoO7RulsB6B66unrz569uXTcoDQlAAvIRiIkJ27VzM9Q95KP1f5aCusf/+QLA6f9QAlD3+EMvLNxWLQEYaw5vBUgAEoAEIAFIABKABCABSAAS+DcIQN3j36D8m87BEXCjixPvJr3ZH3F9WdDxqX57Z/kf3B52CfzxN90RXDYkAAlAApDA70hAnP6VuW5iaXfH0nY2pU72pQNcq+cNZu2azbt9QBjpg3CZv+Om4Johgf8mAah7/Deve5O75gn5H7NCVnw+ofF8Pvn+GAefNaPDz6xMengo//2VisBzpX4bU585vF9z/tsjCA4SgAQgAUgAEvg3CJTmlI2dVHzn2+sC0zuI80O2g0+6Xvh7Xt6lcOaKM1WD5pTad6qcMwjoIeKijH9jPXAOSAAS+AkCUPf4CXh/Vtc8RtGGL2eJjyZ0D9x9IMenEy71qHGpb4fUAs/3on6Pxb2eiLyeibs/4/d6PFmNOTPuRgGz+M8CAHcDCUACkAAk8CsS4Nw6KijgLaSN2EdwO4vrcALnuIvgvpjcfzh10mC1WetVRtzBucR/ZDFWnCnv3JuxYbIoNeJX3AZcEyQACdQQgLoHvBEQoVh49Ott3Zdzd2S8XqhaGtQpSdjryUvXNwus/D20YzQo1SjUd0pYLLLbJhgRil5lBEF2kAAkAAlAApDAP02AExgaa+OI0tVWVyHhcZj601UhhEC0NlBIZpOHTFCdepPSpfTW1/I+47iXt//Tq4LjQwKQQNsIQN2jbdz+nF7AyWqc7+7FcXfnqFWVe7440vG9i2Ycut59kVmp+TKrw/7YrrNDe7j491X62F8z2ANBi+emvi5klvw5IOBOIAFIABKABH5BAgIe9fxTr+dXnjyb9PbdtODPs589nnhwT79Zkzt5uRl ữ Y này.", "a": "16"}, {"n": "num-1", "stem": "Một phân tử mRNA trưởng thành có chiều dài 408 nm. Tính số lượng amino acid trong chuỗi polypeptide hoàn chỉnh do mRNA này tổng hợp (đã trừ đi amino acid mở đầu).", "a": "398"}, {"n": "num-2", "stem": "Cho các thông tin sau:<br>(1) mRNA sau phiên mã được trực tiếp dùng làm khuôn để tổng hợp protein.<br>(2) Khi ribosome tiếp xúc với mã kết thúc trên mRNA thì quá trình dịch mã hoàn tất.<br>(3) Nhờ một enzyme đặc hiệu, amino acid mở đầu được cắt khỏi chuỗi polypeptide vừa tổng hợp.<br>(4) mRNA sau phiên mã được cắt bỏ intron, nối các exon lại với nhau thành mRNA trưởng thành. Các thông tin nào đúng về sự phiên mã và dịch mã với cả tế bào nhân thực và tế bào nhân sơ ( thông tin đúng theo thứ tự từ bé đến lớn)", "a": "23"}, {"n": "num-5", "stem": "Quá trình dịch mã diễn ra trên một mRNA với sự tham gia của 5 ribosome tạo thành polyribosome. Số lượng chuỗi polypeptide được tổng hợp khi toàn bộ quá trình kết thúc là bao nhiêu?", "a": "5"}, {"n": "num-1", "stem": "Trong một quy trình tạo vi khuẩn E. coli sản xuất insulin người, nếu sử dụng 100 plasmid và 100 gene insulin, hiệu suất nối tạo DNA tái tổ hợp là 60%. Số phân tử DNA tái tổ hợp thu được là bao nhiêu?", "a": "60"}, {"n": "num-2", "stem": "Để kiểm tra vi khuẩn đã nhận được plasmid tái tổ hợp chứa gene kháng ampicillin hay chưa, người ta nuôi cấy 1000 vi khuẩn lên đĩa thạch chứa kháng sinh ampicillin. Sau một thời gian đếm được 150 khuẩn lạc phát triển. Tỉ lệ phần trăm vi khuẩn đã biến nạp thành công là bao nhiêu?", "a": "15"}, {"n": "num-3", "stem": "Một gene mã hóa enzyme ở vi khuẩn dài 4080 Å. Khi dùng PCR nhân bản đoạn gene này qua 4 chu kì, tổng số chuỗi polynucleotide đơn được tổng hợp hoàn toàn từ nguyên liệu môi trường là bao nhiêu?", "a": "30"}, {"n": "num-2", "stem": "Một cá thể mang kiểu gene AaBbDd. Trong quá trình phát sinh giao tử không xảy ra đột biến, các gene phân li độc lập. Tính số loại giao tử tối đa cá thể này có thể tạo ra.", "a": "8"}, {"n": "num-5", "stem": "Trong thí nghiệm của Mendel, nếu lai cây hạt vàng thuần chủng (YY) với cây hạt xanh thuần chủng (yy) thu được F1. Cho F1 tự thụ phấn, ở F2 thu được 8000 hạt. Tính số lượng hạt xanh (yy) thu được ở F2 theo lý thuyết.", "a": "2000"}, {"n": "num-1", "stem": "Chiều cao cây do 3 cặp gene phân li độc lập tác động theo kiểu cộng gộp (A,a; B,b; D,d). Cây thấp nhất (aabbdd) cao 100cm, mỗi allele trội làm cây cao thêm 5cm. Một cây có kiểu gene AaBBDd sẽ có chiều cao bao nhiêu cm?", "a": "120"}, {"n": "num-2", "stem": "Màu hoa mõm chó do 1 gene có 2 allele quy định, di truyền trội không hoàn toàn. Lai cây hoa hồng (Aa) với cây hoa hồng (Aa). Tính tỉ lệ phần trăm cây hoa đỏ (AA) ở đời con.", "a": "25"}, {"n": "num-5", "stem": "Hai cây có kiểu gene AABb và AaBB lai với nhau, màu sắc do 2 gene phân li độc lập. Tính số loại kiểu gene tối đa thu được ở đời con F1.", "a": "4"}]};

function upd(){document.getElementById("side").innerHTML=side()}
function body(q){const L="ABCD";
if(q.k=="mc")return q.o.map((o,i)=>{let c="o";if(done){if(o.c)c+=" ok";else if(q.pick===i)c+=" no"}else if(q.pick===i)c+=" sel";return `<button class="${c}" onclick="pick(${i})"><b>${L[i]}.</b> ${o.t}</button>`}).join("")+(done&&q.pick===null?'<div class="mu">Bạn chưa chọn đáp án câu này.</div>':"");
if(q.k=="tf")return q.s.map((t,i)=>{const cl=v=>{let c="o";if(done){if(q.a[i]===v)c+=" ok";else if(q.pick[i]===v)c+=" no"}else if(q.pick[i]===v)c+=" sel";return c};return `<div class="tfr"><div>${"abcd"[i]}) ${t}</div><div class="tb"><button class="${cl(true)}" onclick="tfp(${i},true)">Đúng</button><button class="${cl(false)}" onclick="tfp(${i},false)">Sai</button></div></div>`}).join("")+(done?`<div class="mu">Đúng ${ntf(q)}/4 ý.</div>`:"");
return `<input class="inp${done?(ok(q)?" ok":" no"):""}" id="inp" inputmode="decimal" autocomplete="off" placeholder="Nhập đáp án..." value="${q.val.replace(/"/g,"&quot;")}" ${done?"disabled":""} oninput="Q[cur].val=this.value;upd()">${done?`<div style="margin-top:8px">Đáp án đúng: <b>${q.a}</b></div>`:""}`}
function draw(){const q=Q[cur];let score="";
if(done){const e=Q.reduce((a,x)=>a+sc(x),0),m=Q.reduce((a,x)=>a+({mc:W.mc,tf:W.tf,num:W.num})[x.k],0);score=`<div class="card" style="margin-bottom:12px;text-align:center"><div class="mu">Kết quả – ${TITLE[mode]} – Mã ${code}</div><div class="big">${(e*10/m).toFixed(2)} / 10</div><div>Đúng hoàn toàn ${Q.filter(x=>st(x)=="r").length}/${Q.length} câu</div><button class="b" style="margin-top:10px" onclick="start()">Làm lại (mã mới)</button> <button class="b g" style="margin-top:10px" onclick="home()">Chọn đề khác</button></div>`}
app.innerHTML=`<div class="card side" id="side">${side()}</div><div>${score}<div class="card"><div class="ins">${q.sec.t}</div>${q.sec.p?`<button class="b g" style="padding:6px 12px;font-size:14px;margin-bottom:8px" onclick="showP=!showP;draw()">${showP?"▲ Ẩn bài đọc":"▼ Hiện bài đọc"}</button>${showP?`<div class="pass">${q.sec.p}</div>`:""}`:""}<p class="stem">Câu ${cur+1}. ${q.stem}</p>${(q.img||[]).map(s=>`<img class="qi" src="${s}">`).join("")}${body(q)}<div class="nav"><button class="b g" onclick="go(cur-1)" ${cur?"":"disabled"}>← Câu trước</button><button class="b g" onclick="go(cur+1)" ${cur<Q.length-1?"":"disabled"}>Câu sau →</button></div></div></div>`}
function go(i){if(i<0||i>=Q.length)return;cur=i;draw();scrollTo(0,0)}
function pick(i){if(done)return;Q[cur].pick=i;draw()}
function tfp(i,v){if(done)return;Q[cur].pick[i]=Q[cur].pick[i]===v?null:v;draw()}
function sub(){done=true;draw();scrollTo(0,0)}
home();
</script></body></html>
